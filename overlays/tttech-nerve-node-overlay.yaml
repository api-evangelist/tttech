      https://docs.nerve.cloud/user_guide/local_ui/
- target: $.servers
  update:
  - url: http://172.20.2.1:3333
    description: >-
      Documented Local UI / Node API address on the host-access interface of a Nerve Device (MFN 100,
      MFN 200, fitlet3, SIMATIC IPC427E, SIMATIC IPC BX-39A, Vecow SPC-5600). Added by API Evangelist;
      it is not in the vendor document.
  - url: http://{wanip}:3333
    description: >-
      Devices without a dedicated host-access port (Kontron KBox A-250, MOXA DRP-A100) serve the Local UI
      on the WAN interface address. Added by API Evangelist.
    variables:
      wanip:
        default: 172.20.2.1
        description: IP address of the node's WAN interface
