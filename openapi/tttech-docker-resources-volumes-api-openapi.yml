openapi: 3.2.0
info:
  version: 2.10.0
  description: 'Nerve OVDM API to manage:

    - node configuration

    - system configuration

    - system network configuration

    - workloads

    - remote connections

    - dna'
  title: Nerve Node DOCKER RESOURCES VOLUMES API
  contact:
    name: Nerve support
    email: support@tttech-industrial.com
security:
- cookieAuth: []
tags:
- name: DOCKER_RESOURCES_VOLUMES
paths:
  /api/docker-resources/volumes:
    get:
      tags:
      - DOCKER_RESOURCES_VOLUMES
      operationId: list_volumes
      summary: List all docker volumes from the node
      description: Retrieve a list of all docker volumes from the node.
      x-permissions:
      - DOCKER_RESOURCES:VOLUME_LIST
      responses:
        '200':
          description: Volumes successfully fetched from node.
          content:
            application/json:
              schema:
                description: List all docker volumes from the node
                type: object
                additionalProperties: false
                required:
                - volumes
                properties:
                  volumes:
                    type: array
                    description: Docker volumes from the node
                    minItems: 0
                    maxItems: 1001
                    items:
                      type: object
                      required:
                      - name
                      - usedByContainers
                      - usedByWorkloads
                      - size
                      - createdAt
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          description: Docker volume name
                          minLength: 1
                          maxLength: 1000
                          pattern: ^[\x20-\x7E\t\n\r]*$
                        size:
                          type: integer
                          description: Size of the volume in bytes
                          minimum: 0
                          maximum: 1073741824000
                        createdAt:
                          type: string
                          description: Creation date of the volume in ISO 8601 format
                          format: date-time
                          minLength: 24
                          maxLength: 24
                        usedByContainers:
                          type: array
                          description: Docker containers using the volume
                          minItems: 0
                          maxItems: 1000
                          items:
                            type: string
                            description: Docker container name
                            minLength: 2
                            maxLength: 100
                            pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]+$
                        usedByWorkloads:
                          type: array
                          description: Workloads using the volume
                          minItems: 0
                          maxItems: 1000
                          items:
                            type: object
                            required:
                            - name
                            - type
                            - versionName
                            additionalProperties: false
                            properties:
                              name:
                                type: string
                                description: Workload name
                                minLength: 1
                                maxLength: 40
                                pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                              type:
                                type: string
                                description: Workload type
                                enum:
                                - vm
                                - docker
                                - codesys
                                - docker-compose
                              versionName:
                                type: string
                                description: Workload version name
                                minLength: 1
                                maxLength: 40
                                pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
              examples:
                docker_volumes:
                  value:
                    volumes:
                    - name: volume1
                      size: 1000000
                      createdAt: '2025-03-20T10:04:22.000Z'
                      usedByContainers:
                      - container1
                      - container2
                      usedByWorkloads:
                      - name: workload1
                        type: docker
                        versionName: v1
                      - name: workload2
                        type: docker-compose
                        versionName: v2
                    - name: volume2
                      size: 2000000
                      createdAt: '2025-03-28T12:02:53.000Z'
                      usedByContainers:
                      - container3
                      - container4
                      usedByWorkloads:
                      - name: workload3
                        type: docker
                        versionName: v1
                      - name: workload4
                        type: docker-compose
                        versionName: v2
        '401':
          description: You are not authorized to perform this operation
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: User not authorized
                  required:
                  - user
                  additionalProperties: false
                  properties:
                    user:
                      type: string
                      description: Not authorized
                      enum:
                      - not authorized
                - type: object
                  description: User not authorized
                  required:
                  - status
                  - msg
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      minimum: 401
                      maximum: 401
                      description: HTTP status code
                    msg:
                      type: string
                      description: Error message
                      enum:
                      - Not authorized
                      - not authorized
                - type: object
                  description: Cookie header is missing in the request
                  required:
                  - status
                  - message
                  - errors
                  additionalProperties: false
                  properties:
                    status:
                      description: HTTP status code
                      type: integer
                      enum:
                      - 401
                    message:
                      type: string
                      description: The validation error message
                      enum:
                      - '''cookie'' header required'
                    errors:
                      type: array
                      minItems: 1
                      maxItems: 1001
                      description: List of errors
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Specified location within the document where the error occurred
                          message:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Error message
              examples:
                not_authorized_usr:
                  value:
                    user: not authorized
                not_authorized_status:
                  value:
                    status: 401
                    msg: Not authorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                description: Description of error associated with status code.
                required:
                - status
                - msg
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                  msg:
                    type: string
                    minLength: 1
                    maxLength: 1001
                    description: Error message
                    pattern: .*
              examples:
                forbidden:
                  value:
                    status: 403
                    msg: Forbidden
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                description: Description of error associated with status code.
                required:
                - status
                - msg
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                  msg:
                    type: string
                    minLength: 1
                    maxLength: 1001
                    description: Error message
                    pattern: .*
  /api/docker-resources/volumes/{name}:
    delete:
