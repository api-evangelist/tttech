  /api/docker-resources/volumes/{name}/import:
    post:
      summary: Import data to an existing docker volume
      description: Import data to an existing docker volume. The data is provided as a zip archive.
      operationId: import_data_to_volume
      tags:
      - DOCKER_RESOURCES_VOLUMES
      x-permissions:
      - DOCKER_RESOURCES:VOLUME_IMPORT
      parameters:
      - name: name
        in: path
        required: true
        description: The name of the Docker volume to which the data will be imported.
        schema:
          type: string
          description: Docker volume name
          minLength: 1
          maxLength: 1000
          pattern: ^[\x20-\x7E\t\n\r]*$
      requestBody:
        description: Defines volume data to be imported
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Object containing the zip archive file that includes both the data archive and its SHA256 hash.
              properties:
                file:
                  type: string
                  format: binary
                  description: File to be uploaded
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: successful operation, data applied to volume, new volume size returned
          content:
            application/json:
              schema:
                description: Object containing the size of the volume after the import operation.
                type: object
                required:
                - volumeSize
                additionalProperties: false
                properties:
                  volumeSize:
                    type: integer
                    description: Size of the volume in bytes
                    minimum: 1
                    maximum: 10000000000
              example:
                volumeSize: 123456789
        '400':
          description: Bad request
          content:
            application/json:
              schema:
