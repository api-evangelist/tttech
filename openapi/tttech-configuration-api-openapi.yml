  /api/setup/configurations/secure-id:
    get:
      summary: Get node secure id
      tags:
      - Configuration
      operationId: get_node_secure_id
      description: Used to obtain a secure id of the node.
      x-permissions:
      - SECURE_ID:VIEW
      responses:
        '200':
          description: Request successful. The secure id of the node returned.
          content:
            application/json:
              schema:
                type: object
                description: Object containing 'secureid' property, which represents the secure ID of the node
                required:
                - secureId
                additionalProperties: false
                properties:
                  secureId:
                    description: The secure ID of the node, or an empty string if the node is not onboarded.
                    oneOf:
                    - type: string
                      description: Node secure id
                      minLength: 16
                      maxLength: 16
                      pattern: ([A-Za-z]|\d){16}
                    - type: string
                      enum:
                      - ''
              example:
                secureId: 52F4E8CA6B9BDADA
        '401':
          description: You are not authorized to perform this operation
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: User not authorized
