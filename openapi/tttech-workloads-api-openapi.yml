  /api/workloads/{deviceId}/apply-configuration:
    post:
      summary: Apply configuration to workload
      description: The method is used to apply configuration to docker and docker-compose workloads.
      operationId: apply_workload_configuration
      tags:
      - Workloads
      x-permissions:
      - WORKLOAD_DOCKER_CONFIGURATION:APPLY
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Unique identifier of the deployed workload. Device is a term used for workloads.
        schema:
          type: string
          description: Id of the deployed workload
          pattern: ^\d+$
          minLength: 1
          maxLength: 1001
      requestBody:
        description: Defines workload configuration
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Object containing the configuration archive file and data regarding the workload for which the configuration is to be applied
              properties:
                file:
                  type: string
                  format: binary
                  description: File to be uploaded
                data:
                  type: object
                  description: "Provides information about the workload and its configuration.\n**Example Request Data**:\n- **For Docker**:\n  ```json\n  {\n    \"deviceId\": 111,\n    \"user\": \"local@nerve.cloud\",\n    \"timestamp\": 1713250137163,\n    \"configurations\": [\n      {\n        \"volumeName\": \"volume\",\n        \"containerPath\": \"/tmp\"\n      }\n    ],\n    \"restartOnConfigurationUpdate\": true\n  }\n  ```\n  \n- **For Docker Compose**:\n  ```json\n  {\n    \"deviceId\": 243,\n    \"service\": \"nginx\",\n    \"user\": \"local@nerve.cloud\",\n    \"timestamp\": 1713251166323,\n    \"configurations\": [\n      {\n        \"volumeName\": \"volume1\",\n        \"containerPath\": \"/tmp\"\n      }\n    ],\n    \"restartOnConfigurationUpdate\": false\n  }\n  ```\n  \n**Notes**: - Ensure that the volume is created on the workload before applying the configuration. - After the volume is created, the workload needs to be (re)deployed."
                  additionalProperties: false
                  required:
                  - configurations
                  - user
                  - timestamp
                  - restartOnConfigurationUpdate
                  properties:
                    service:
                      type: string
                      description: The name of the service defined in the docker-compose file. Service name can only contain numbers, letters,_ and -.
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
                      minLength: 1
                      maxLength: 40
                    user:
                      type: string
                      description: The username of the user who initiated request to apply configuration
                      minLength: 1
                      maxLength: 1001
                      pattern: .*
                    configurations:
                      type: array
                      description: List of volume objects containing volume name and container path
                      minItems: 0
                      maxItems: 1001
                      items:
                        type: object
                        properties:
                          volumeName:
                            type: string
                            description: 'The docker volume name. The name is extracted from docker-compose file. Volume name can only contain numbers, letters, _ and -. NOTE: For now only volume name is allowed. Bind mount points are not allowed.'
                            pattern: ^[A-z0-9-.]*$
                            minLength: 1
                            maxLength: 1001
                          containerPath:
                            type: string
                            description: Container destination path which is mounted to specified volume
                            pattern: ^[A-z0-9/.-]*$
                            minLength: 1
                            maxLength: 1001
                    restartOnConfigurationUpdate:
                      type: boolean
                      description: Indicator if container will be restarted when applying configuration
                      default: false
                    timestamp:
                      type: integer
                      description: Time when configuration was applied to the workload(in milliseconds).
      responses:
        '204':
          description: successful operation, configuration applied
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: Validation error.
                  required:
                  - status
                  - message
                  - errors
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      description: HTTP status code
                    message:
                      type: string
                      minLength: 1
                      maxLength: 1001
                      description: The validation error message
                    errors:
                      type: array
                      minItems: 1
                      maxItems: 1001
                      description: Detailed description of what does not match the schema
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Specified location within the document where the error occurred
                          message:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Error message
                - type: object
                  description: Description of error associated with status code.
                  required:
                  - status
                  - msg
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      description: HTTP status code
                    msg:
                      type: string
                      minLength: 1
                      maxLength: 1001
                      description: Error message
                      pattern: .*
        '401':
          description: You are not authorized to perform this operation
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: User not authorized
                  required:
                  - user
                  additionalProperties: false
                  properties:
                    user:
                      type: string
                      description: Not authorized
                      enum:
                      - not authorized
                - type: object
                  description: User not authorized
                  required:
                  - status
                  - msg
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      minimum: 401
                      maximum: 401
                      description: HTTP status code
                    msg:
                      type: string
                      description: Error message
                      enum:
                      - Not authorized
                      - not authorized
                - type: object
                  description: Cookie header is missing in the request
                  required:
                  - status
                  - message
                  - errors
                  additionalProperties: false
                  properties:
                    status:
                      description: HTTP status code
                      type: integer
                      enum:
                      - 401
                    message:
                      type: string
                      description: The validation error message
                      enum:
                      - '''cookie'' header required'
                    errors:
                      type: array
                      minItems: 1
                      maxItems: 1001
                      description: List of errors
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Specified location within the document where the error occurred
                          message:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Error message
              examples:
                not_authorized_usr:
                  value:
                    user: not authorized
                not_authorized_status:
                  value:
                    status: 401
                    msg: Not authorized
