                              description: Docker container name
                              minLength: 2
                              maxLength: 100
                              pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]+$
                            locationUrl:
                              type: string
                              description: URL path for accessing the web UI of a container
                      services:
                        type: array
                        description: Information about services defined within compose workload
                        minItems: 1
                        maxItems: 1001
                        items:
                          type: object
                          required:
                          - containerName
                          - state
                          - message
                          - timestamp
                          properties:
                            containerName:
                              type: string
                              description: Docker container name
                              minLength: 2
                              maxLength: 100
                              pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]+$
                            state:
                              type: integer
                              description: Status enumeration that corresponds to the state of individual containers in compose workload
                              minimum: 0
                              maximum: 12
                            message:
                              type: string
                              description: message describing state of individual containers
                              enum:
                              - container_running
                              - container_created
                              - container_restarting
                              - container_paused
                              - container_exited
                              - container_dead
                              - container_starting
                              - container_stopping
                              - container_pausing
