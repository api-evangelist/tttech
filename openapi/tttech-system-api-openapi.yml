openapi: 3.2.0
info:
  version: 2.10.0
  description: 'Nerve OVDM API to manage:

    - node configuration

    - system configuration

    - system network configuration

    - workloads

    - remote connections

    - dna'
  title: Nerve Node SYSTEM API
  contact:
    name: Nerve support
    email: support@tttech-industrial.com
security:
- cookieAuth: []
tags:
- name: System
paths:
  /api/system/status:
    get:
      summary: Get an overview of the system state
      tags:
      - System
      description: Get an overview of the system state including CPU, memory, disk usage, current memory usage, current Docker space usage, and current VM space usage.
      operationId: get_system_status
      x-permissions:
      - SYSTEM:STATUS
      responses:
        '200':
          description: Success operation
          content:
            application/json:
              schema:
                type: object
                description: Object containing information about system status, including CPU and memory usage/availability.
                additionalProperties: false
                required:
                - cpy_history
                - memory_history
                - mem
                - docker
                - lvm
                - docker_history
                properties:
                  system_start_timestamp:
                    type: number
                    description: Timestamp indicating the system start time. This value represents the time in seconds since a specific epoch (e.g., Unix epoch).
                  cpy_history:
                    type: array
                    description: CPU usage (in percent) history. Sampled each 10 seconds.
                    minItems: 0
                    maxItems: 1001
                    items:
                      type: number
                  memory_history:
                    type: array
                    description: Memory usage (in percent) history. Sampled each 10 seconds.
                    minItems: 0
                    maxItems: 1001
                    items:
                      type: number
                  docker_history:
                    type: array
                    description: History of Docker container resource usage.
                    minItems: 0
                    maxItems: 1001
                    items:
                      type: number
                  mem:
                    type: object
                    properties:
                      total:
                        type: number
                        description: Total amount of memory
                      free:
                        type: number
                        description: Unused amount of memory(available memory)
                      percent:
                        type: number
                        description: Percentage memory usage
                    description: Current memory usage (amount in bytes). Sampled every 10 seconds.
                  docker:
                    type: object
                    properties:
                      total:
                        type: number
                        description: Total amount of memory
                      free:
                        type: number
                        description: Unused amount of memory(available memory)
                      used:
                        type: number
                        description: The amount memory in use
                      unit:
                        type: string
                        description: Unit of measurement for memory
                      percent:
                        type: number
                        description: Percentage memory usage
                      ovdm_version:
                        type: string
                        description: Version of the data format. Determines how statistics are processed on the UI.
                    description: Current docker space usage (amount in bytes). Sampled every 10 seconds.
                  lvm_history:
                    type: array
                    description: Disk usage (in percent) history. Sampled each minute.
                    minItems: 0
                    maxItems: 1001
                    items:
                      type: number
                  lvm:
                    type: object
                    properties:
                      total:
                        type: number
                        description: Total amount of VM space.
                      free:
                        type: number
                        description: Available VM space.
                      used:
                        type: number
                        description: VM space in use
                      unit:
                        type: string
                        description: Unit of measurement
                      percent:
                        type: number
                        description: Percentage of VM space used
                      ovdm_version:
                        type: string
                        description: Version of the data format. Determines how statistics are processed on the UI.
                    description: Current VM space usage (amount in bytes). Sampled every 10 seconds.
              example:
                cpy_history:
                - 13.272003649992762
                - 9.826248313090419
                memory_history:
                - 70.96332568352194
                - 70.97511972048622
                docker_history:
                - 80
                - 80
                lvm_history:
                - 21.71875
                - 21.71875
                system_start_timestamp: 957640.35
                mem:
                  total: 33479.156
                  free: 9691.521
                  percent: 71.05207458823028
                docker:
                  total: 1
                  free: 0.8
                  used: 0.2
                  unit: TB
                  percent: 80
                  ovdm_version: '2.0'
                lvm:
                  total: 64
                  free: 13.9
                  used: 50.1
                  unit: GB
                  percent: 21.71875
                  ovdm_version: '2.0'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: Validation error.
                  required:
                  - status
                  - message
                  - errors
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      description: HTTP status code
                    message:
                      type: string
                      minLength: 1
                      maxLength: 1001
                      description: The validation error message
                    errors:
                      type: array
                      minItems: 1
                      maxItems: 1001
                      description: Detailed description of what does not match the schema
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Specified location within the document where the error occurred
                          message:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Error message
                - type: object
                  description: Description of error associated with status code.
                  required:
                  - status
                  - msg
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      description: HTTP status code
                    msg:
                      type: string
                      minLength: 1
                      maxLength: 1001
                      description: Error message
                      pattern: .*
        '401':
          description: You are not authorized to perform this operation
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: User not authorized
                  required:
                  - user
                  additionalProperties: false
                  properties:
                    user:
                      type: string
                      description: Not authorized
                      enum:
                      - not authorized
                - type: object
                  description: User not authorized
                  required:
                  - status
                  - msg
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      minimum: 401
                      maximum: 401
                      description: HTTP status code
                    msg:
                      type: string
                      description: Error message
                      enum:
                      - Not authorized
                      - not authorized
                - type: object
                  description: Cookie header is missing in the request
                  required:
                  - status
                  - message
                  - errors
                  additionalProperties: false
                  properties:
                    status:
                      description: HTTP status code
                      type: integer
                      enum:
                      - 401
                    message:
                      type: string
                      description: The validation error message
                      enum:
                      - '''cookie'' header required'
                    errors:
                      type: array
                      minItems: 1
                      maxItems: 1001
                      description: List of errors
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Specified location within the document where the error occurred
                          message:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Error message
              examples:
                not_authorized_usr:
                  value:
                    user: not authorized
                not_authorized_status:
                  value:
                    status: 401
                    msg: Not authorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                description: Description of error associated with status code.
                required:
                - status
                - msg
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                  msg:
                    type: string
                    minLength: 1
                    maxLength: 1001
                    description: Error message
                    pattern: .*
              examples:
                forbidden:
                  value:
                    status: 403
                    msg: Forbidden
  /api/system/reboot:
    post:
      summary: Initiates a system reboot
      tags:
      - System
      description: Initiates a system reboot. This route allows for initiating a system reboot.
      operationId: node_system_reboot
      x-permissions:
      - SYSTEM:REBOOT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - source
              type: object
              description: Specifies the source for initiating the system reboot. Possible values are 'management_system' and 'local_ui'
              properties:
                source:
                  type: string
                  description: Indicates from which application the request is initiated.
                  enum:
                  - local_ui
                  - management_system
                  example: local_ui
      responses:
        '200':
          description: OK
