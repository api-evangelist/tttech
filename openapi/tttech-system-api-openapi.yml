  /api/system/info:
    get:
      summary: Get system information
      tags:
      - System
      description: Retrieves system information, returning an array of capabilities. The "capabilities" field represents system node reported capabilities, which are strings indicating various capabilities of the system.
      operationId: get_system_info
      x-permissions:
      - SYSTEM:INFO
      responses:
        '200':
          description: Success operation. Returns system information.
          content:
            application/json:
              schema:
                type: object
                description: Object containing a list of the node capabilities
                additionalProperties: false
                required:
                - capabilities
                properties:
                  capabilities:
                    type: array
                    description: System node reported capabilities
                    minItems: 0
                    maxItems: 1001
                    items:
                      type: string
                      enum:
                      - Docker Container
                      - Docker Compose
                      - Logging and Monitoring via Fluent Bit
                      - Virtualization via XEN
                      - Virtualization via ACRN
                      - Virtualization via KVM
                      - Virtualization
                      - CODESYS PLC
                      - Nerve Data Services
                      - Audit Logs
