    put:
      summary: Set network state
      tags:
      - System
      x-permissions:
      - SYSTEM_NETWORK:EDIT
      description: Set network state to either "on" or "off". When sending a request, include the desired network state as a string ("on" to turn the network on, "off" to turn it off). In the case of disabling the network, the node on the management system (MS) will become offline and cannot be managed, as if its power was physically disconnected.
      operationId: set_network_state
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Object containing the 'network' property representing the network state to be set (off/on).
              properties:
                network:
                  description: Network state
                  enum:
                  - 'on'
                  - 'off'
                  type: string
                  example: 'on'
        required: true
      responses:
        '200':
          description: Success operation.
          content:
