      description: The list of requested connections awaiting approval before they can be established.
      operationId: get_remote_connections_waiting_approval
      responses:
        '200':
          description: Request successful. The list of requested remote connections awaiting approval returned. Approval is required for every remote connection with Local acknowledgment set to YES before establishment.
          content:
            application/json:
              schema:
                type: object
                description: Object containing the list of remote connections awaiting approval.
                required:
                - connections
                additionalProperties: false
                properties:
                  connections:
                    type: array
                    description: The list of requested remote connections.
                    minItems: 0
                    maxItems: 1001
                    items:
                      type: object
                      description: Object representing a remote connection
                      required:
                      - connectionRequestUid
                      - connectionUid
                      - initiator
                      - name
                      additionalProperties: false
                      properties:
                        connectionRequestUid:
                          description: Randomly generated uuid using uuidv4 library
                          type: string
                          minLength: 36
                          maxLength: 36
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        connectionUid:
                          description: Randomly generated uuid using uuidv4 library
                          type: string
                          minLength: 36
                          maxLength: 36
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        name:
                          description: The name of the remote connection.
                          type: string
                          pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                        initiator:
                          description: Who initiated the remote connections operation.
                          type:
                          - string
                          - 'null'
