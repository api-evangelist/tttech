  /nerve/v2/active-remote-connections/tunnel/{activeConnectionId}/{requestUid}/{generateSessionId}:
    get:
      summary: Get active connection by id and rtem-session if it is required
      operationId: get_active_rc
      tags:
      - Remote Connections
      x-internal: true
      security:
      - bearerAuth: []
      description: Used to get an active connection by id(referenced by activeConnectionId and requestUid) and rtem-session, if it is required(generateSessionId).
      parameters:
      - name: activeConnectionId
        in: path
        required: true
        description: Active remote connection id.
        schema:
          description: ID (from Management System) of the entry. Can be a string or an object.
          oneOf:
          - description: ID (from Management System) of the entry
            type: string
            pattern: ^[0-9a-fA-F]{24}$
            minLength: 24
            maxLength: 24
          - type: object
      - name: requestUid
        in: path
        required: true
        description: Active remote connection unique identifier.
        schema:
          description: Randomly generated uuid using uuidv4 library
          type: string
          minLength: 36
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      - name: generateSessionId
        in: path
        required: true
        description: Flag that indicates weather rtem-session should be created or not.
        schema:
          type: boolean
      x-permissions:
      - GLOBAL:PUBLIC
      responses:
        '200':
          description: Returns object containing information about active remote connection and rtem-session if one was created.
          content:
            application/json:
              schema:
                type: object
                description: Object containing information about active connection and rtem-session if it is created.
                additionalProperties: false
                required:
                - connection
                - tunnelTypes
                properties:
                  connection:
                    type: object
                    description: Information about specific active connection.
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                        description: Remote connection name
                        pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                        minLength: 1
                        maxLength: 40
                      serialNumber:
                        description: The serial number of the node
                        type: string
                        maxLength: 12
                        minLength: 12
                        pattern: ([A-Z0-9]){12}
                      nodeStatus:
                        description: Status if the node connection to MS
                        enum:
                        - online
                        - offline
                      credentials:
                        type: object
                        description: Credentials for chisel authentication
                        required:
                        - username
                        - password
                        properties:
                          username:
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
                            description: Username for chisel authentication
                            minLength: 1
                            maxLength: 1001
                          password:
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
                            description: Password for chisel authentication
                            minLength: 1
                            maxLength: 1001
                      ports:
                        type: object
                        description: Information about ports relevant to the active remote connection.
                        additionalProperties: false
                        required:
                        - localPort
                        - remotePort
                        - cloudPort
                        properties:
