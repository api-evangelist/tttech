  /nerve/v2/node/{serial_number}/import-remote-connections:
    put:
      summary: Import remote connections on selected node
      operationId: import_rc_on_node
      tags:
      - Node V2
      description: Method is used to import remote connections on selected node.
      parameters:
      - name: serial_number
        in: path
        required: true
        description: The serial number of the node which was specified during onboarding into the Nerve Management System.
        schema:
          description: The serial number of the node
          type: string
          maxLength: 12
          minLength: 12
          pattern: ([A-Z0-9]){12}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              type: object
              description: File with remote connections to be imported on selected node
              properties:
                file:
                  description: File containing remote connection details to be imported
                  type: string
                  format: binary
                  minLength: 1
                  maxLength: 1000
            example:
              file: example-file-content
      x-permissions:
      - NODE:EDIT
      responses:
        '200':
          description: List of imported remote connections
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 1001
                description: List of imported remote connections
                items:
                  description: Array of different remote connection types.
                  anyOf:
                  - type: object
                    description: An object containing data about remote tunnel connection. Remote tunnel connection is connection that is established between local workstation and the target. For those connections Nerve Connection Manager application MUST be installed on local workstation.
                    required:
                    - name
                    - acknowledgment
                    - port
                    - localPort
                    - type
                    properties:
                      type:
                        type: string
                        description: Remote connection type
                        enum:
                        - TUNNEL
                      name:
                        type: string
                        description: Remote connection name
                        pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                        minLength: 1
                        maxLength: 40
                      acknowledgment:
                        type: string
                        description: Defines if local acknowledgement is required to establish a connection. To confirm connection, it is necessary to have access to the LocalUI web application.
                        enum:
                        - 'Yes'
                        - 'No'
                      port:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 65535
                        description: Port on the target to which connection is established (port on the node for opening tunnel to chisel server)
                      localPort:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 65535
                        description: Port on local PC to establish remote tunnel
                      serviceName:
                        type:
                        - string
                        - 'null'
                        description: A extra parameter of the remote connection for 'docker-compose' workload. Refers to one of the services listed in the compose YAML file, a service(container) for which remote connection has been configured. This is a mandatory parameter for remote connections for 'docker-compose' workloads, but not for other workload types.
                        pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
                        minLength: 1
                        maxLength: 40
                  - type: object
                    description: An object containing data about remote tunnel connection. Remote tunnel connection is connection that is established between local workstation and the target. For those connections Nerve Connection Manager application MUST be installed on local workstation.
                    required:
                    - name
                    - acknowledgment
                    - hostname
                    - port
                    - localPort
                    - type
                    properties:
                      type:
                        type: string
                        description: Remote connection type
                        enum:
                        - TUNNEL
                      name:
                        type: string
                        description: Remote connection name
                        pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                        minLength: 1
                        maxLength: 40
                      acknowledgment:
                        type: string
                        description: Defines if local acknowledgement is required to establish a connection. To confirm connection, it is necessary to have access to the LocalUI web application.
                        enum:
                        - 'Yes'
                        - 'No'
                      hostname:
                        type: string
                        description: Target hostname or ip address to which connection is established
                        minLength: 1
                        maxLength: 40
                        pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$
                      port:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 65535
                        description: Port on the target to which connection is established (port on the node for opening tunnel to chisel server)
                      localPort:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 65535
                        description: Port on local PC to establish remote tunnel
                      serviceName:
                        type:
                        - string
                        - 'null'
                        description: A extra parameter of the remote connection for 'docker-compose' workload. Refers to one of the services listed in the compose YAML file, a service(container) for which remote connection has been configured. This is a mandatory parameter for remote connections for 'docker-compose' workloads, but not for other workload types.
                        pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
                        minLength: 1
                        maxLength: 40
                  - description: Remote screen connection - type VNC
                    allOf:
                    - anyOf:
                      - type: object
                        description: An object containing data about remote screen connection. Remote screen connection is the connection that is established between Management System and a target(node or deployed workload). Those connections are based on Guacamole.
                        required:
                        - name
                        - numberOfConnections
                        - acknowledgment
                        - hostname
                        - port
                        - autoretry
                        - type
                        properties:
                          type:
                            type: string
                            description: Remote connection type
                            enum:
                            - SCREEN
                          name:
                            type: string
                            description: Remote connection name
                            pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                            minLength: 1
                            maxLength: 40
                          numberOfConnections:
                            type: integer
                            format: int32
                            description: The maximum number of simultaneous connections
                            minimum: 1
                            maximum: 100
                          acknowledgment:
                            type: string
                            description: Defines if local acknowledgement is required to establish a connection. To confirm connection, it is necessary to have access to the LocalUI web application.
                            enum:
                            - 'Yes'
                            - 'No'
                          hostname:
                            type: string
                            description: Target hostname or ip address to which connection is established
                            minLength: 1
                            maxLength: 40
                            pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$
                          port:
                            type: integer
                            format: int32
                            minimum: 0
                            maximum: 65535
                            description: Port on the target to which connection is established (port on the node for opening tunnel to chisel server)
                          autoretry:
                            type: integer
                            format: int32
                            description: The number of times to retry connecting before giving up and returning an error
                            minimum: 1
                            maximum: 3
                          cursor:
                            type: string
                            description: 'Defines if the cursor is rendered locally or remotely  '
                            enum:
                            - ''
                            - local
                            - remote
                          readOnly:
                            type: boolean
                            description: Defines whether the connection should be read-only.
                          swapRedBlue:
                            description: Specifies whether the red and blue indicators for the remote connection should be swapped
                            type: boolean
                          serviceName:
                            type:
                            - string
                            - 'null'
                            description: A extra parameter of the remote connection for 'docker-compose' workload. Refers to one of the services listed in the compose YAML file, a service(container) for which remote connection has been configured. This is a mandatory parameter for remote connections for 'docker-compose' workloads, but not for other workload types.
                            pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
                            minLength: 1
