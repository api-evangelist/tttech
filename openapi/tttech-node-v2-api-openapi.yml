openapi: 3.2.0
info:
  version: 3.1.0
  description: 'Nerve Management System API to manage: -labels -nodes -workloads -notifications -capabilities'
  title: Nerve Management System NODE V2 API
  contact:
    name: Nerve support
    email: support@tttech-industrial.com
servers:
- url: https://trynerve1.nerve.cloud
security:
- sessionId: []
tags:
- name: Node V2
  description: The operations to manage nodes v2.
paths:
  /nerve/v2/node/logging-monitoring/{serialNumber}:
    get:
      summary: Get the monitoring and logging configuration
      description: Get the logging and monitoring configuration of the selected node. The logging level can viewed as well.
      operationId: get_nerve_v2_node_logging_monitoring_serial_number
      tags:
      - Node V2
      parameters:
      - name: serialNumber
        in: path
        required: true
        description: The serial number of the node which was specified during onboarding into the Nerve Management System.
        schema:
          description: The serial number of the node
          type: string
          maxLength: 12
          minLength: 12
          pattern: ([A-Z0-9]){12}
      x-permissions:
      - NODE:LOGGING_AND_MONITORING_SETTINGS
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                title: LoggingMonitoringLogLevels
                description: Configuration for logging, monitoring, and log levels across various systems
                type: object
                properties:
                  loggingMonitoring:
                    description: Logging and monitoring configuration
                    type: object
                    properties:
                      supported:
                        type: boolean
                        description: Is logging and monitoring supported
                      dockerMonitoring:
                        type: boolean
                        description: Is docker monitoring enabled
                      systemMonitoring:
                        type: boolean
                        description: Is system monitoring enabled
                      dockerLogging:
                        type: boolean
                        description: Is docker logging enabled
                      systemLogging:
                        type: boolean
                        description: If enabled the node collects system logs and sends them to the management system.
                    required:
                    - supported
                  logLevels:
                    description: Log level configuration
                    type: object
                    title: Log levels model
                    properties:
                      dataId:
                        type: string
                        pattern: ^[\x20-\x7E\t\n\r]*$
                        minLength: 1
                        maxLength: 1000
                        description: Identifier for the log levels
                      values:
                        type: object
                        description: Contains the log level settings for various systems
                        required:
                        - ovdm
                        properties:
                          ovdm:
                            type: object
                            description: Log levels configuration for the OVDM system
                            properties:
                              ovdm:
                                type: object
                                description: Log levels settings for the OVDM system
                                properties:
                                  level:
                                    type: string
                                    pattern: ^[\x20-\x7E\t\n\r]*$
                                    minLength: 1
                                    maxLength: 1000
                                    description: Specifies the current log level
                                  options:
                                    type: array
                                    minItems: 0
                                    maxItems: 1001
                                    description: Lists the available log level options
                                    items:
                                      type: object
                                      description: Contains the name and value for a log level option
                                      properties:
                                        name:
                                          type: string
                                          pattern: ^[\x20-\x7E\t\n\r]*$
                                          minLength: 1
                                          maxLength: 1000
                                          description: The name of the log level
                                        value:
                                          type: string
                                          pattern: ^[\x20-\x7E\t\n\r]*$
                                          minLength: 1
                                          maxLength: 1000
                                          description: The value associated with the log level
                          libvirt:
                            type: object
                            description: Log levels configuration for the LibVirt system
                            properties:
                              libvirt_ctl:
                                type: object
                                description: Log levels settings for the LibVirt system
                                properties:
                                  level:
                                    type: string
                                    pattern: ^[\x20-\x7E\t\n\r]*$
                                    minLength: 1
                                    maxLength: 1000
                                    description: Specifies the current log level
                                  options:
                                    type: array
                                    minItems: 0
                                    maxItems: 1001
                                    description: Lists the available log level options
                                    items:
                                      type: object
                                      description: Contains the name, value, and node for a log level option
                                      properties:
                                        name:
                                          type: string
                                          pattern: ^[\x20-\x7E\t\n\r]*$
                                          minLength: 1
                                          maxLength: 1000
                                          description: The name of the log level
                                        value:
                                          type: integer
                                          format: int32
                                          description: The value associated with the log level
                                          minimum: 0
                                          maximum: 1000000
                                        nodeEq:
                                          type: string
                                          pattern: ^[\x20-\x7E\t\n\r]*$
                                          minLength: 1
                                          maxLength: 1000
                                          description: The identifier for the node in which the log level is applied
                          codesys:
                            type: object
                            description: Log levels configuration for the CODESYS system
                            properties:
                              codesys_ctl:
                                type: object
                                description: Log levels settings for the CODESYS control system
                                properties:
                                  level:
                                    type: string
                                    pattern: ^[\x20-\x7E\t\n\r]*$
                                    minLength: 1
                                    maxLength: 1000
                                    description: Specifies the current log level
                                  options:
                                    type: array
                                    minItems: 0
                                    maxItems: 1001
                                    description: Lists the available log level options
                                    items:
                                      type: object
                                      description: Contains the name, value, and node for a log level option
                                      properties:
                                        name:
                                          type: string
                                          pattern: ^[\x20-\x7E\t\n\r]*$
                                          minLength: 1
                                          maxLength: 1000
                                          description: The name of the log level
                                        value:
                                          type: integer
                                          format: int32
                                          description: The value associated with the log level
                                          minimum: 0
                                          maximum: 1000000
                                        nodeEq:
                                          type: string
                                          pattern: ^[\x20-\x7E\t\n\r]*$
                                          minLength: 1
                                          maxLength: 1000
                                          description: The identifier for the node in which the log level is applied
                      timestamp:
                        type: integer
                        format: int64
                        description: The timestamp indicating when the log levels were set or modified
                        minimum: 0
                        maximum: 4102444800000
                    required:
                    - dataId
                    - values
                required:
                - loggingMonitoring
                - logLevels
              examples:
                logging_monitoring_config:
                  value:
                    loggingMonitoring:
                      supported: true
                      dockerMonitoring: true
                      systemMonitoring: true
                      dockerLogging: true
                    logLevels:
                      dataId: node_logging
                      values:
                        ovdm:
                          ovdm:
                            level: info
                            options:
                            - name: DEBUG
                              value: debug
                            - name: INFO
                              value: info
                            - name: WARN
                              value: warn
                            - name: ERROR
                              value: error
                        codesys:
                          codesys_ctl:
                            level: '30'
                            options:
                            - name: DEBUG
                              value: 10
                              nodeEq: debug
                            - name: INFO
                              value: 20
                              nodeEq: info
                            - name: WARNING
                              value: 30
                              nodeEq: warn
                            - name: ERROR
                              value: 40
                              nodeEq: error
                            - name: CRITICAL
                              value: 50
                              nodeEq: error
                      timestamp: 1662464757565
        '403':
          description: You are not authorized to perform this operation
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              examples:
                not_authorized:
                  value:
                    errorCode: '00003'
                    httpCode: '403'
                    message: You are not authorized
        '404':
          description: Node with provided serial number was not found.
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              example:
                errorCode: nerve_node_012
                httpCode: '404'
                message: Node you are looking for was not found
        '409':
          description: Node is offline
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              example:
                errorCode: nerve_node_018
                httpCode: '409'
                message: Node is offline
        '500':
          description: Example response
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              example:
                httpCode: '500'
                errorCode: nerve_node_023
                message: Get logging and monitoring status operation failed
    post:
      summary: Set monitoring and logging configuration
      operationId: put_nerve_node_logging_monitoring_serial_number
      description: Apply logging and monitoring configuration of the selected node. The logging level can be set as well.
      tags:
      - Node V2
      parameters:
      - name: serialNumber
        in: path
        required: true
        description: The serial number of the node which was specified during onboarding into the Nerve Management System.
        schema:
          description: The serial number of the node
          type: string
          maxLength: 12
          minLength: 12
          pattern: ([A-Z0-9]){12}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Configures logging and monitoring across the system, providing controls to enable or disable Docker and system monitoring, and to set log levels for components such as OVDM, LibVirt, and CODESYS.
              properties:
                loggingMonitoring:
                  type: object
                  description: Logging and monitoring configuration
                  required:
                  - dockerMonitoring
                  - systemMonitoring
                  - dockerLogging
                  properties:
                    dockerMonitoring:
                      type: boolean
                      description: Enable or disable docker monitoring
                    systemMonitoring:
                      type: boolean
                      description: Enable or disable system monitoring
                    dockerLogging:
                      type: boolean
                      description: Enable or disable docker logging
                    systemLogging:
                      type: boolean
                      description: If enabled the node collects system logs and sends them to the management system.
                logLevels:
                  type: object
                  description: Log level configuration
                  properties:
                    ovdm:
                      type: string
                      description: Log levels settings for the OVDM system
                      enum:
                      - info
                      - debug
                      - warn
                      - error
                    libvirt_ctl:
                      type: string
                      description: Log levels settings for the LibVirt system
                      enum:
                      - '10'
                      - '20'
                      - '30'
                      - '40'
                      - '50'
                    codesys_ctl:
                      type: string
                      description: Log levels configuration for the CODESYS system
                      enum:
                      - '10'
                      - '20'
                      - '30'
                      - '40'
                      - '50'
                    timeout:
                      type: integer
                      format: int32
                      description: How long to keep logging configuration in milliseconds.   The maximum time that can be set is 24 hours. If the time is not set(equal to 0), the default value will be applied (1h)
                      default: 3600000
                      minimum: 0
                      maximum: 86400000
                    systemLogFilter:
                      type: string
                      description: 'Specifies which system logs are sent to the Management System.   Options:   - ''all'': send all system logs.   - ''ovdm'': send only logs from the OVDM service.'
                      enum:
                      - all
                      - ovdm
                      default: ovdm
                  required:
                  - ovdm
              required:
              - loggingMonitoring
              - logLevels
        required: true
      x-permissions:
      - NODE:LOGGING_AND_MONITORING_SETTINGS
      responses:
        '204':
          description: Successful operation
        '400':
          description: Route params validation error
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              example:
                errorCode: '00006'
                httpCode: '400'
                message: Route params validation error
        '403':
          description: You are not authorized to perform this operation
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
