                        port:
                          description: Port on the target to which connection is established (port on the node for opening tunnel to chisel server)
                          oneOf:
                          - type: integer
                            format: int32
                            minimum: 0
                            maximum: 65535
                            description: Port which is used to establish connection
                          - type: string
