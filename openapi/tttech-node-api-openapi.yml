  /nerve/node/{nodeId}:
    get:
      summary: Get data of the selected node
      operationId: get_node
      tags:
      - Node
      description: Used to retrieve one specific node by the nodeId parameter. The delete route uses the serial number as parameter. This will be redesigned in v2 Node release.
      parameters:
      - name: nodeId
        in: path
        required: true
        description: Node id specified by the Management System.
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      - name: fetchFreshNodeData
        in: query
        description: When getting node information from the database, with fetchFreshNodeData query param set to true, latest node information will be retrieved directly from the node device.
        required: false
        schema:
          type: boolean
          default: true
      responses:
