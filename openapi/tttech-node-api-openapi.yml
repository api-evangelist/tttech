                            - 'null'
                            format: int64
                            description: Timestamp when node update started
                            minimum: 0
                            maximum: 4102444800000
                          lastSystemStart:
                            type:
                            - integer
                            - 'null'
                            format: int64
                            description: Timestamp when the node was last started
                            minimum: 0
                            maximum: 4102444800000
                          connectionStatus:
                            description: Status if the node connection to MS
                            enum:
                            - online
