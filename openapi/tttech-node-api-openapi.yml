                      description: The name of the hardware model (hardware model must be defined in the database)
                      minLength: 1
                      maxLength: 1000
                      type: string
                      pattern: ^[\x20-\x7E\t\n\r]*$
                    labels:
                      description: List of labels assigned to the node
                      type: array
                      minItems: 0
                      maxItems: 1001
                      items:
