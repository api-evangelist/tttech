            application/json:
              schema:
                description: Node object from the database
                type: object
                allOf:
                - description: Node object  from the database without remote connections
                  type: object
                  required:
                  - name
                  - serialNumber
                  - type
                  - hash
                  - labels
                  - subgroup
                  - created
                  - rebootStatus
                  - connectionStatus
                  - vmBackup
                  - vmSnapshot
                  - userId
                  properties:
                    _id:
                      allOf:
                      - description: ID (from Management System) of the entry. Can be a string or an object.
