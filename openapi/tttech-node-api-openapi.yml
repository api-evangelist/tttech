                      type: string
                      pattern: ^[\x20-\x7E\t\n\r]*$
                      description: Identification of the hardware manufacturer
                      default: nerve
                      minLength: 1
                      maxLength: 1000
                    subgroup:
                      type: string
                      pattern: ^[\x20-\x7E\t\n\r]*$
                      minLength: 1
                      maxLength: 1000
                      description: Node subgroup
                    unassignInProgress:
                      type: boolean
