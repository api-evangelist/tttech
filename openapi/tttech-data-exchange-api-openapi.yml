                              - docker-compose
                            statusChangedTimestamp:
                              type: integer
                              format: int64
                              description: Time when state of the workload has changed in milliseconds.
                              minimum: 0
                              maximum: 4102444800000
                            workloadVersionName:
                              type: string
                              description: Version name
                              minLength: 1
                              maxLength: 40
                              pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                            deployTime:
                              type: integer
                              format: int64
