                            versionId:
                              description: ID (from Management System) of the entry
                              type: string
                              pattern: ^[0-9a-fA-F]{24}$
                              minLength: 24
                              maxLength: 24
                            status:
                              type: string
                              description: Status of workload in queue
                              enum:
                              - New
                              - Reserved
                              - Queued
                              - Downloading
                              - Downloaded
                              - Installed
                              - Removing
                              - Removing_failed
                            name:
                              type: string
                              description: Workload name
                              minLength: 1
                              maxLength: 40
                              pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                            type:
                              description: Workload type
                              type: string
                              enum:
                              - docker
                              - vm
