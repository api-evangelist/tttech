                                        minimum: 1
                                        maximum: 1000
                                memory:
                                  type: object
                                  description: Object containing the current and original values of defined memory
                                  properties:
                                    current:
                                      description: Current values of defined memory
                                      type: integer
                                      format: int64
                                      minimum: 100000000
                                      maximum: 20000000000
                                    originally:
                                      description: Original values of defined memory
                                      type: integer
                                      format: int64
                                      minimum: 100000000
                                      maximum: 20000000000
                      - description: Payload of the compose workload
                        allOf:
                        - type: object
                          description: Basic payload of the workload
                          required:
                          - workloadId
                          - status
