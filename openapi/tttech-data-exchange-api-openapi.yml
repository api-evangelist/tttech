                            wiseDeviceStatus:
                              type: integer
                              format: int32
                              description: 'Status of deployed workload

                                - 0 *IDLE*

                                - 1 *CREATING*

                                - 2 *REMOVING*

                                - 3 *SUSPENDING*

                                - 4 *SUSPENDED*

                                - 5 *STARTING*

                                - 6 *RESTARTING*

