                                - 9 *STOPPING*

                                - 10 *STOPPED*

                                - 11 *ERROR*

                                - 12 *REMOVING_FAILED*

                                - 13 *PARTIALLY_RUNNING*

                                '
                              minimum: 0
                              maximum: 13
                            deviceId:
                              type: integer
                              format: int32
                              description: Id of the deployed workload
                              minimum: 100
                              maximum: 1000
                        - type: object
                          required:
                          - servicesInformation
                          - configurationUpdateInfo
                          properties:
                            servicesInformation:
                              type: array
                              description: Information about services defined within compose workload
                              minItems: 1
                              maxItems: 1001
                              items:
                                type: object
                                required:
                                - containerName
                                - state
                                - message
                                - timestamp
                                properties:
                                  containerName:
                                    type: string
                                    description: Docker container name
                                    minLength: 2
                                    maxLength: 100
                                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]+$
                                  state:
                                    type: integer
                                    format: int32
                                    description: Status enumeration that corresponds to the state of individual containers in compose workload
                                    minimum: 0
                                    maximum: 12
                                  message:
                                    type: string
                                    description: message describing state of individual containers
                                    enum:
                                    - container_running
                                    - container_created
                                    - container_restarting
                                    - container_paused
                                    - container_exited
                                    - container_dead
                                    - container_starting
                                    - container_stopping
                                    - container_pausing
                                    - container_resuming
                                  timestamp:
                                    description: Timestamp of the last state change in Unix epoch format
                                    type: integer
                                    format: int64
                                    minimum: 0
                                    maximum: 4102444800000
                            configurationUpdateInfo:
                              type: array
                              minItems: 0
                              maxItems: 1001
                              description: List of configuration storages
                              items:
                                type: object
                                description: Configuration storage information for docker workload
                                required:
                                - restartOnConfigurationUpdate
                                - path
                                - name
                                - serviceName
                                properties:
                                  restartOnConfigurationUpdate:
                                    type: boolean
                                    description: Indicator if container will be restarted when applying configuration
                                    default: false
                                  name:
                                    type: string
                                    description: 'The docker volume name. The name is extracted from docker-compose file. Volume name can only contain numbers, letters, _ and -. NOTE: For now only volume name is allowed. Bind mount points are not allowed.'
                                    pattern: ^[A-z0-9-.]*$
                                    minLength: 1
                                    maxLength: 1001
                                  path:
                                    type: string
                                    description: Container destination path which is mounted to specified volume
                                    pattern: ^[A-z0-9/.-]*$
                                    minLength: 1
