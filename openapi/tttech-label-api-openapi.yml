openapi: 3.2.0
info:
  version: 3.1.0
  description: 'Nerve Management System API to manage: -labels -nodes -workloads -notifications -capabilities'
  title: Nerve Management System LABEL API
  contact:
    name: Nerve support
    email: support@tttech-industrial.com
servers:
- url: https://trynerve1.nerve.cloud
security:
- sessionId: []
tags:
- name: Label
  description: The operations to manage labels
paths:
  /nerve/labels:
    post:
      summary: Create label
      operationId: create_label
      tags:
      - Label
      description: Create a new label. A label helps to organize your workloads and nodes. After creation it needs to be assigned to a node or workload.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The key-value pair representing a label.
              properties:
                key:
                  description: Definition of a label key property
                  type: string
                  minLength: 1
                  maxLength: 40
                  pattern: ^[a-zA-Z0-9_-]*$
                value:
                  description: Definition of a label value property
                  type: string
                  minLength: 1
                  maxLength: 40
                  pattern: ^[^\s]*$
              required:
              - key
              - value
            examples:
              label:
                value:
                  key: node
                  value: mfn-100
        required: true
      x-permissions:
      - LABEL:CREATE
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                description: A single label delivered from the backend.
                allOf:
                - type: object
                  description: The key-value pair representing a label.
                  properties:
                    key:
                      description: Definition of a label key property
                      type: string
                      minLength: 1
                      maxLength: 40
                      pattern: ^[a-zA-Z0-9_-]*$
                    value:
                      description: Definition of a label value property
                      type: string
                      minLength: 1
                      maxLength: 40
                      pattern: ^[^\s]*$
                  required:
                  - key
                  - value
                - description: ID (from Management System) of the entry. Can be a string or an object.
                  oneOf:
                  - description: ID (from Management System) of the entry
                    type: string
                    pattern: ^[0-9a-fA-F]{24}$
                    minLength: 24
                    maxLength: 24
                  - type: object
                - type: object
                  properties:
                    createdAt:
                      description: Date and time when label was initially created.
                      anyOf:
                      - type: string
                        format: date-time
                        minLength: 8
                        maxLength: 30
                      - type: object
              examples:
                label_rsp:
                  value:
                    key: hardware
                    value: mfn-100
                    createdAt: '2022-03-14T15:27:58.780Z'
                    _id: 63ca8b3379623c0702ebb6dc
                    __v: 0
        '400':
          description: Route params validation error
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              example:
                errorCode: '00006'
                httpCode: '400'
                message: Route params validation error
        '403':
          description: You are not authorized to perform this operation
