  /nerve/labels/group:
    get:
      summary: Get labels grouped by their keys
      operationId: get_label_group
      tags:
      - Label
      description: Get a list of labels, that is grouped by their individual label keys. The groups are returned paged.
      parameters:
      - name: limit
        in: query
        description: Number of items per page of the result.
        schema:
          description: Number of items in result set when paging is applied
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 500
      - name: page
        in: query
        required: false
        description: The number of the page to be returned. Items per page is defined by the limit parameter.
        schema:
          description: Page (zero indexed) of results to get from backend
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 1000
      - name: filterBy
        in: query
        description: Defines a name for the filter. If not defined, no filter is set and all labels will be displayed.
        allowReserved: true
        required: false
        schema:
          type: object
          additionalProperties: false
          maxProperties: 1
          properties:
            key:
              type: string
              description: Filter the list by key name.
              pattern: ^(?!.*\x00).*$
              minLength: 0
              maxLength: 1000
            value:
              type: string
              description: Filter the list by value name.
              pattern: ^(?!.*\x00).*$
              minLength: 0
              maxLength: 1000
        style: deepObject
        explode: true
        examples:
          filter_by_key:
            summary: Filter a list of labels by key
            value:
              key: key name
              pattern: ^(?!.*\x00).*$
              minLength: 0
              maxLength: 1000
      x-permissions:
      - LABEL:GROUP
      responses:
        '200':
          description: The groups were successfully fetched.
          content:
            application/json:
              schema:
                description: Paged list of label groups (group is a set of labels having same key).
                properties:
                  count:
                    type: number
                    minimum: 0
                    description: Number of items in result-set.
                  data:
                    description: Array of groups.
                    type: array
                    minItems: 0
                    maxItems: 1001
                    items:
                      properties:
                        _id:
                          description: Definition of a label key property
                          type: string
                          minLength: 1
                          maxLength: 40
                          pattern: ^[a-zA-Z0-9_-]*$
                        key:
                          description: Definition of a label key property
                          type: string
                          minLength: 1
                          maxLength: 40
                          pattern: ^[a-zA-Z0-9_-]*$
                        count:
                          type: number
                          description: Number of labels matching given key.
                        keys:
                          description: Array of keys (always contains only one key)
                          type: array
                          minItems: 0
                          maxItems: 1001
                          items:
                            type: object
                            properties:
                              key:
                                description: Definition of a label key property
                                type: string
                                minLength: 1
                                maxLength: 40
                                pattern: ^[a-zA-Z0-9_-]*$
                        labels:
                          description: Array of labels that share same key.
                          type: array
                          minItems: 0
                          maxItems: 1001
                          items:
                            type: object
                            description: The key-value pair representing a label.
                            properties:
                              key:
                                description: Definition of a label key property
                                type: string
                                minLength: 1
                                maxLength: 40
                                pattern: ^[a-zA-Z0-9_-]*$
                              value:
                                description: Definition of a label value property
                                type: string
                                minLength: 1
                                maxLength: 40
                                pattern: ^[^\s]*$
                            required:
                            - key
                            - value
                      required:
                      - count
                      - key
                      - labels
                required:
                - count
                - data
              examples:
                label_group:
                  value:
                    count: 2
                    data:
                    - _id: hw
                      key: hw
                      count: 2
                      keys:
                      - key: hw
                      labels:
                      - key: hw
                        value: mfn-100
                      - key: hw
                        value: siemens
                    - _id: sw
                      key: sw
                      count: 1
                      keys:
                      - key: sw
                      labels:
                      - key: sw
                        value: debian
