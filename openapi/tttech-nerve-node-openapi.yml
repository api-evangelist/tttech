      - WORKLOADS LOGS
      summary: Get the logs of specific docker container through an event stream
      description: Get logs about general Docker container information, like configuration and when it was started, through an SSE event stream.
      operationId: get_workload_log_event
      x-permissions:
      - WORKLOAD:VIEW_DOCKER_LOGS
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Unique identifier of the deployed workload. Device is a term used for workloads.
        schema:
          type: string
          description: Id of the deployed workload
          pattern: ^\d+$
          minLength: 1
          maxLength: 1001
      - name: name
        in: path
        required: true
        description: Name of the Docker container.
        schema:
          type: string
          description: Docker container name
          minLength: 2
          maxLength: 100
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]+$
      responses:
        '200':
          description: Successfully subscribed to SSE event stream and fetched logs.
          content:
            text/event-stream:
              schema:
                type: object
