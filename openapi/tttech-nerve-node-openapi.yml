  /api/setup/network/init-config-update:
    post:
      summary: Initiating network interface update
      tags:
      - SETUP NETWORK
      x-permissions:
      - NETWORK_INTERFACE:EDIT
      description: Initiating network interface update.
      operationId: initiating_network_update
      requestBody:
        description: Initiating network interface update.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Object containing the list of network interface configurations to be applied
              required:
              - configurations
              additionalProperties: false
              properties:
                configurations:
                  type: array
                  minItems: 1
                  maxItems: 1001
                  description: List of network interface configurations to be applied
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      interface_name:
                        type: string
                        description: The name of the network interface. This field specifies the logical name  assigned to a network interface. It helps in identifying different interfaces  such as WAN
                          or external interfaces that connect to different parts of the network.
                        enum:
                        - wan
                        - extern1
                        - extern2
                        - extern3
                      allocation:
                        type: string
                        description: "The method of IP address allocation for the network interface. This field  indicates how the IP address for the interface is assigned.  - If the allocation is 'dhcp',\
                          \ the IP address of the port will be assigned \n  dynamically by the DHCP server, making it easier to manage addresses centrally.\n- If the allocation is 'static', the IP address\
                          \ of the port will be manually \n  defined, providing a fixed and permanent address which is crucial for servers \n  or services requiring stable IP addresses.\n- If the allocation\
                          \ is 'unconfigured', the port is disabled for the host (it has \n  no IP address), but can still be used for virtual machines with bridged interfaces, \n  which is useful in virtualized\
                          \ environments where the host does not need direct \n  network access."
                        enum:
                        - dhcp
                        - static
                        - unconfigured
                      ip_address:
                        description: The IP address assigned to the interface. This is the unique identifier assigned  to the network interface which allows it to communicate within the network. It should  be
                          in the standard IPv4 format.
                        type: string
                        format: ipv4
                        minLength: 0
                        maxLength: 15
                        pattern: ^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                      netmask:
                        description: The netmask associated with the IP address. This defines the subnet of the  IP address, helping to determine which part of the IP address denotes the network  and which
                          part denotes the host. It should be in the standard IPv4 format.
                        type: string
                        format: ipv4
                        minLength: 0
                        maxLength: 15
                        pattern: ^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                      domainNames:
                        description: The domain names associated with the interface. These are human-readable  names that map to the IP address of the interface, used for easier identification  and access
                          within the network. This can either be a single domain name as a string  or an array of domain names.
                        anyOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                            minLength: 0
                            maxLength: 1001
                      gateway:
                        description: The IP address of the gateway associated with the interface. This is the router  address that serves as the access point or IP router that a network device uses to send  information
                          to a different network or the internet. It should be in the standard IPv4 format.
                        type: string
                        format: ipv4
                        minLength: 0
                        maxLength: 15
                        pattern: ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                      disabledWanTraffic:
                        description: Block incoming traffic on the WAN interface
                        type: boolean
                        default: false
                    required:
                    - interface_name
                    - allocation
                    - ip_address
                    - netmask
            examples:
              wan:
                value:
                  configurations:
                  - allocation: dhcp
                    domainNames:
                    - 192.168.231.186
                    - 192.168.231.189
                    gateway: 0.0.0.0
                    interface_name: wan
                    ip_address: 10.85.10.63
                    netmask: 255.255.255.0
              unconfigured:
                value:
                  configurations:
                  - allocation: unconfigured
                    interface_name: extern2
                    ip_address: 0.0.0.0
                    netmask: 0.0.0.0
              static:
                value:
                  configurations:
                  - allocation: static
                    interface_name: extern3
                    domainNames: ''
                    ip_address: 10.85.10.63
                    netmask: 255.255.255.0
      responses:
        '200':
          description: Successful initialization of network interface update.
          content:
            application/json:
              schema:
                type: object
                description: Object containing 'message' property which indicating the network interface update has been initiated
                properties:
                  message:
                    type: string
                    description: Message indicating that the network interface update has been initiated
              example:
                message: ''
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: Validation error.
