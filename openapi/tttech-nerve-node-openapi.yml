  /api/workloads/{deviceId}/control/{command}:
    put:
      summary: Workload control
      description: Control  workloads - start, stop, suspend, restart, resume or undeploy it.
      operationId: control_workload
      tags:
      - WORKLOADS
      x-permissions:
      - WORKLOAD:CONTROL
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Unique identifier of the deployed workload. Device is a term used for workloads.
        schema:
          type: string
          description: Id of the deployed workload
          pattern: ^\d+$
          minLength: 1
          maxLength: 1001
      - name: command
        in: path
        required: true
        description: Operation to perform on codesys workload (start, stop, undeploy).
        schema:
          type: string
          enum:
          - START
          - STOP
          - SUSPEND
          - RESTART
          - RESUME
          - UNDEPLOY
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Control workload route request payload
              additionalProperties: false
              required:
              - workloadId
              properties:
                workloadId:
                  oneOf:
                  - description: ID (from Management System) of the entry
                    type: string
                    pattern: ^[0-9a-fA-F]{24}$
                    minLength: 24
                    maxLength: 24
                  - description: ID created as workloadId(from database)-uniqueId(randomly generated uuid when workload is queued).
                    type: string
                    pattern: ^[0-9a-fA-F]{24}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    minLength: 61
                    maxLength: 61
                removeImages:
                  type: boolean
                  default: false
                  description: 'Determines whether Docker and Docker Compose images associated with the deployed workload should be removed.

                    - If set to **true**, all images linked to the workload will be deleted from the system.

                    - If set to **false**, the images will remain in the system.

                    This setting applies specifically to workloads using the Management System Registry.

                    '
            example:
              workloadId: 64be62c627d17a2ffc02457e
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: Object containing information on whether the command was successful or not
                additionalProperties: false
                required:
