                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Error message
              examples:
                not_authorized_usr:
                  value:
                    user: not authorized
                not_authorized_status:
                  value:
                    status: 401
                    msg: Not authorized
        '403':
          description: Response returned when a user is not allowed to change password. - Users logged in with their Management System credentials cannot changed their password on the node - Default admin
            cannot change password if the account is deactivated
          content:
            application/json:
              schema:
                type: object
                description: Description of error associated with status code.
                required:
                - status
                - msg
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    description: HTTP status code
                  msg:
                    type: string
                    minLength: 1
                    maxLength: 1001
                    description: Error message
                    pattern: .*
              examples:
                ms_user_cannot_change_password:
                  value:
                    status: 403
                    msg: Changing account password through this application is not allowed
                default_account_inactive:
                  value:
                    status: 403
                    msg: Account is deactivated, and its password cannot be changed.
                user_can_change_only_own_password:
                  value:
                    status: 403
                    msg: Changing passwords for other users is not allowed.
  /api/init:
    post:
      security:
      - basicAuth: []
      summary: Configuration for node connection to cloud
      tags:
      - INITIALIZATION
      x-permissions:
      - NODE:INIT
      description: Configuration for node connection to cloud, as well as for LocalUI authentication.
      operationId: set_configuration
      requestBody:
        description: Object containing the cloud_url (the URL of the cloud server the node will connect to), local_ui_pwd (password for accessing the LocalUI), system_pwd (system password for node authentication)
          and serial_number (unique identifier of the node).
        content:
          application/json:
            schema:
              required:
              - cloud_url
              - local_ui_pwd
              - serial_number
              - system_pwd
              type: object
