              - allOf:
                - type: object
                  description: Object containing required data to update specified local repository
                  required:
                  - path
                  - protocol
                  - type
                  properties:
                    path:
                      description: Specifies the local path where the repository is located.
                      type: string
                      minLength: 1
                      maxLength: 1001
                    type:
                      description: Type of local repository
                      type: string
                      enum:
                      - vmBackups
                      - workloads
                    protocol:
