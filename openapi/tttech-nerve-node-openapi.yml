  /api/setup/network/interfaces:
    get:
      summary: Get network configuration
      tags:
      - SETUP NETWORK
      x-permissions:
      - NETWORK_INTERFACE:VIEW
      description: Get current setup of the network interfaces.
      operationId: get_network_configuration
      responses:
        '200':
          description: Successful operation. The network configuration returned.
          content:
            application/json:
              schema:
                type: object
                description: Object containing the list of network interfaces and the status of the configuration process
                additionalProperties: false
                properties:
                  interfaces:
                    minItems: 1
                    maxItems: 1001
                    type: array
                    description: List of network interfaces
                    items:
                      type: object
                      properties:
                        interface_name:
                          type: string
                          description: The name of the network interface. This field specifies the logical name  assigned to a network interface. It helps in identifying different interfaces  such as WAN
                            or external interfaces that connect to different parts of the network.
                          enum:
                          - wan
                          - extern1
                          - extern2
                          - extern3
                        allocation:
                          type: string
                          description: "The method of IP address allocation for the network interface. This field  indicates how the IP address for the interface is assigned.  - If the allocation is 'dhcp',\
                            \ the IP address of the port will be assigned \n  dynamically by the DHCP server, making it easier to manage addresses centrally.\n- If the allocation is 'static', the IP address\
                            \ of the port will be manually \n  defined, providing a fixed and permanent address which is crucial for servers \n  or services requiring stable IP addresses.\n- If the allocation\
                            \ is 'unconfigured', the port is disabled for the host (it has \n  no IP address), but can still be used for virtual machines with bridged interfaces, \n  which is useful in\
                            \ virtualized environments where the host does not need direct \n  network access."
                          enum:
                          - dhcp
                          - static
                          - unconfigured
                        ip_address:
                          description: The IP address assigned to the interface. This is the unique identifier assigned  to the network interface which allows it to communicate within the network. It should  be
                            in the standard IPv4 format.
                          type: string
                          format: ipv4
                          minLength: 0
                          maxLength: 15
                          pattern: ^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                        netmask:
                          description: The netmask associated with the IP address. This defines the subnet of the  IP address, helping to determine which part of the IP address denotes the network  and
                            which part denotes the host. It should be in the standard IPv4 format.
                          type: string
                          format: ipv4
                          minLength: 0
                          maxLength: 15
                          pattern: ^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                        domainNames:
                          description: The domain names associated with the interface. These are human-readable  names that map to the IP address of the interface, used for easier identification  and access
                            within the network. This can either be a single domain name as a string  or an array of domain names.
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                              minLength: 0
                              maxLength: 1001
                        gateway:
                          description: The IP address of the gateway associated with the interface. This is the router  address that serves as the access point or IP router that a network device uses to
                            send  information to a different network or the internet. It should be in the standard IPv4 format.
                          type: string
                          format: ipv4
                          minLength: 0
                          maxLength: 15
                          pattern: ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                        disabledWanTraffic:
                          description: Block incoming traffic on the WAN interface
                          type: boolean
                          default: false
                  status:
                    type: string
                    description: The status of the configuration process
                    enum:
                    - INIT
                    - IN_PROGRESS
                    - FAILURE
                    - SUCCESS
              example:
                status: INIT
                interfaces:
                - interface_name: wan
                  allocation: dhcp
                  ip_address: 0.0.0.0
                  netmask: 0.0.0.0
                  gateway: 0.0.0.0
                  domainNames:
                  - 127.0.0.11
                - interface_name: extern1
                  allocation: unconfigured
                  ip_address: 0.0.0.0
                  netmask: 0.0.0.0
                  gateway: 0.0.0.0
