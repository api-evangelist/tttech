openapi: 3.2.0
info:
  version: 3.1.0
  description: 'Nerve Management System API to manage: -labels -nodes -workloads -notifications -capabilities'
  title: Nerve Management System SERVICE OS DNA API
  contact:
    name: Nerve support
    email: support@tttech-industrial.com
servers:
- url: https://trynerve1.nerve.cloud
security:
- sessionId: []
tags:
- name: SERVICE-OS-DNA
  description: The operations to manage Service OS DNA configuration
paths:
  /nerve/service-os-dna/{serialNumber}/target:
    put:
      tags:
      - SERVICE-OS-DNA
      summary: Apply target service os configuration
      description: Used to update the existing service os configuration of the selected node by using configuration file.
      operationId: apply_service_os_dna_configuration
      parameters:
      - name: serialNumber
        in: path
        required: true
        description: The serial number of the node which was specified during onboarding into the Nerve Management System.
        schema:
          description: The serial number of the node
          type: string
          maxLength: 12
          minLength: 12
          pattern: ([A-Z0-9]){12}
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              description: Object contains 'file' property, which represents the file to be uploaded
              properties:
                file:
                  type: string
                  minLength: 100
                  maxLength: 30000
                  description: The file to upload.
                  format: binary
        required: true
      x-permissions:
      - NERVE_DNA_SERVICE_OS:EDIT
      responses:
        '202':
          description: Service OS configuration applied successfully.
          content:
            application/json:
              schema:
                type: object
                description: Object with service OS configuration re-applied status message and tracking URI.
                additionalProperties: false
                properties:
                  message:
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
                    description: Message describing the DNA configuration initiation operation
                    minLength: 1
                    maxLength: 1000
                  tracking:
                    type: string
                    description: The URI for getting completion status of job
                    pattern: ^\/nerve\/service-os-dna\/([A-Za-z]|\d){12}\/status$
                    minLength: 1
                    maxLength: 1000
                required:
                - message
                - tracking
              examples:
                dna_configuration_initiated:
                  value:
                    message: Service OS DNA configuration initiated
                    tracking: /nerve/service-os-dna/123456789012/status
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              examples:
                error_upload_config_file:
                  value:
                    httpCode: '400'
                    errorCode: nerve_dna_001
                    message: File upload failed.
                config_file_error:
                  value:
                    httpCode: '400'
                    errorCode: nerve_dna_002
                    message: Payload not defined.
                continue_reconfiguration_not_supported:
                  value:
                    httpCode: '400'
                    errorCode: nerve_dna_019
                    message: Only nodes with version 2.7.0 and greater can continue DNA reconfiguration.
        '401':
          description: You are not authorized to perform this operation
