            application/json:
              schema:
                required:
                - message
                - status
                type: object
                properties:
                  status:
                    type: string
                    description: The current state of Service OS DNA configuration
                    enum:
                    - APPLIED
                    - INITIAL
                    - UNDEFINED
                    - RECONFIGURING
                    - CANCELING
                    - MODIFIED
                  message:
                    type: string
                    minLength: 0
                    maxLength: 1000
