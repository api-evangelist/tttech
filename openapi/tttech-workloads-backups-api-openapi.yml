openapi: 3.2.0
info:
  version: 2.10.0
  description: 'Nerve OVDM API to manage:

    - node configuration

    - system configuration

    - system network configuration

    - workloads

    - remote connections

    - dna'
  title: Nerve Node WORKLOADS BACKUPS API
  contact:
    name: Nerve support
    email: support@tttech-industrial.com
security:
- cookieAuth: []
tags:
- name: WORKLOADS BACKUPS
paths:
  /api/workloads/{deviceId}/backups:
    get:
      summary: Get backups for the specified VM workload
      operationId: get_vm_backups_history
      tags:
      - WORKLOADS BACKUPS
      x-permissions:
      - BACKUP:LIST
      description: Used to obtain the list of previously created backups of the provided VM workload
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Unique identifier of the deployed workload. Device is a term used for workloads.
        schema:
          type: string
          description: Id of the deployed workload
          pattern: ^\d+$
          minLength: 1
          maxLength: 1001
      responses:
        '200':
          description: List of previously created backups(creation history) for the specific VM workload
          content:
            application/json:
              schema:
                type: object
                description: Object containing the list of backup creations for a specific VM workload.
                required:
                - backups
                additionalProperties: false
                properties:
                  backups:
                    type: array
                    description: Objects representing information about previous backups created
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - name
                      - started
                      - status
                      - localRepository
                      - serialNumber
                      properties:
                        name:
                          type: string
                          description: The name of VM workload backup
                          pattern: (\s^)|(^[^\u0000-\u001f\u007f-\u009f]*$)
                          minLength: 1
                          maxLength: 1001
                        started:
                          type: integer
                          description: Time when backup creation started (in milliseconds)
                        status:
                          type: string
                          description: Status of backup creation operation
                          enum:
                          - COMPLETED
                          - FAILED
                          - STOPPING
                          - IN_PROGRESS
                          - ABORTED
                        serialNumber:
                          description: The serial number of the node
                          type: string
                          maxLength: 12
                          minLength: 12
                          pattern: ([A-Z0-9]){12}
                        progress:
                          type: integer
                          description: Operation progress
                          minimum: 0
                          maximum: 100
                        vmStateBeforeBackup:
                          type: string
                          description: State of VM before proceed with backup creation
                          enum:
                          - RUNNING
                          - STOPPING
                          - STOPPED
                          - SUSPENDED
                        finished:
                          type: integer
                          description: Time when backup creation completed(in milliseconds)
                        error:
                          type: string
                          description: Reason why VM backup creation failed
                        localRepository:
                          type: object
                          additionalProperties: false
                          description: Information about the local repository that is used to store VM backups
                          required:
                          - url
                          - protocol
                          properties:
                            url:
                              type: string
                              description: Url of HTTP server
                            user:
                              type:
                              - string
                              - 'null'
                              description: User for authentication to the HTTP server
                            password:
                              type:
                              - string
                              - 'null'
                              description: Password for authentication to the HTTP server
                            protocol:
                              type: string
                              description: Protocol used for communication with the local repository
                              enum:
                              - nfs
                            options:
                              type: string
                              description: Nfs server options
                    minItems: 0
                    maxItems: 1001
              examples:
                vm_backups:
                  value:
                    backups:
                    - name: MMARKOVIC001-vm with snapshot-backup 29-4-2024 8:58:34 GMT+2
                      started: 1714373918785
                      status: COMPLETED
                      localRepository:
                        url: 10.85.10.94:/nfs_shared
                        user: null
                        password: null
                        protocol: nfs
                        options: rw,nolock
                      serialNumber: MMARKOVIC001
                      vmStateBeforeBackup: STOPPED
                      progress: 100
                      finished: 1714373979899
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: Validation error.
                  required:
                  - status
                  - message
                  - errors
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      description: HTTP status code
                    message:
                      type: string
                      minLength: 1
                      maxLength: 1001
                      description: The validation error message
                    errors:
                      type: array
                      minItems: 1
                      maxItems: 1001
                      description: Detailed description of what does not match the schema
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Specified location within the document where the error occurred
                          message:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Error message
                - type: object
                  description: Description of error associated with status code.
                  required:
                  - status
                  - msg
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      description: HTTP status code
                    msg:
                      type: string
                      minLength: 1
                      maxLength: 1001
                      description: Error message
                      pattern: .*
        '401':
          description: You are not authorized to perform this operation
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: User not authorized
                  required:
                  - user
                  additionalProperties: false
                  properties:
                    user:
                      type: string
                      description: Not authorized
                      enum:
                      - not authorized
                - type: object
                  description: User not authorized
                  required:
                  - status
                  - msg
                  additionalProperties: false
                  properties:
                    status:
                      type: integer
                      minimum: 401
                      maximum: 401
                      description: HTTP status code
                    msg:
                      type: string
                      description: Error message
                      enum:
                      - Not authorized
                      - not authorized
                - type: object
                  description: Cookie header is missing in the request
                  required:
                  - status
                  - message
                  - errors
                  additionalProperties: false
                  properties:
                    status:
                      description: HTTP status code
                      type: integer
                      enum:
                      - 401
                    message:
                      type: string
                      description: The validation error message
                      enum:
                      - '''cookie'' header required'
                    errors:
                      type: array
                      minItems: 1
                      maxItems: 1001
                      description: List of errors
                      items:
                        type: object
                        properties:
                          path:
                            type: string
                            minLength: 1
                            maxLength: 1001
                            description: Specified location within the document where the error occurred
                          message:
