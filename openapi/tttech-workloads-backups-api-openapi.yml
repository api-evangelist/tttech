  /api/workloads/backups/deploy:
    post:
      summary: Deploy the selected backup from the local repository
      operationId: deploy_vm_backups
      tags:
      - WORKLOADS BACKUPS
      x-permissions:
      - BACKUP:DEPLOY
      description: Used to deploy selected backup from the local repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Object containing data about the VM backup to deploy on the node
              additionalProperties: false
              required:
              - name
              - deployAsBackup
              properties:
                name:
                  type: string
                  description: The name of VM workload backup
                  pattern: (\s^)|(^[^\u0000-\u001f\u007f-\u009f]*$)
                  minLength: 1
                  maxLength: 1001
                deployAsBackup:
                  type: boolean
                  description: Flag that determines if the backed up vm is going to be deployed as a clone or as a backup.
            examples:
              vm_as_backup:
                value:
                  name: 0000000000NS-vm with snapshot-backup 29-4-2024 14:42:37 GMT+2
                  deployAsBackup: true
              vm_as_clone:
                value:
                  name: 0000000000NS-vm with snapshot-backup 29-4-2024 14:42:37 GMT+2
                  deployAsBackup: false
      responses:
        '200':
          description: List of previously created backups(creation history) for the specific VM workload
          content:
            application/json:
              schema:
                type: object
                description: Workload object
                additionalProperties: false
                required:
                - uniqueId
                - id
                - versionId
                - type
                - workloadName
                - status
                - deployTime
                - deployAsBackup
                properties:
                  uniqueId:
                    description: Randomly generated uuid using uuidv4 library
                    type: string
                    minLength: 36
                    maxLength: 36
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                  id:
                    oneOf:
                    - description: ID (from Management System) of the entry
                      type: string
                      pattern: ^[0-9a-fA-F]{24}$
                      minLength: 24
                      maxLength: 24
                    - description: ID created as workloadId(from database)-uniqueId(randomly generated uuid when workload is queued).
                      type: string
                      pattern: ^[0-9a-fA-F]{24}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                      minLength: 61
                      maxLength: 61
                  versionId:
                    oneOf:
                    - description: ID (from Management System) of the entry
                      type: string
                      pattern: ^[0-9a-fA-F]{24}$
                      minLength: 24
                      maxLength: 24
                    - description: ID created as workloadId(from database)-uniqueId(randomly generated uuid when workload is queued).
                      type: string
                      pattern: ^[0-9a-fA-F]{24}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                      minLength: 61
                      maxLength: 61
                  workloadName:
                    type: string
                    description: Workload name
                    minLength: 1
                    maxLength: 40
                    pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                  status:
                    type: string
                    description: Status of workload in queue
                    enum:
                    - New
                    - Reserved
                    - Queued
                    - Downloading
                    - Downloaded
                    - Installed
                    - Removing
                    - Removing_failed
                  type:
                    type: string
                    description: Workload type
                    enum:
                    - vm
                    - docker
