      description: Used to restart VM backup creation
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Unique identifier of the deployed workload. Device is a term used for workloads.
        schema:
          type: string
          description: Id of the deployed workload
          pattern: ^\d+$
          minLength: 1
          maxLength: 1001
      requestBody:
        required: true
        description: Object contains name of the snapshot
        content:
          application/json:
            schema:
              type: object
              description: Object containing information about the VM backup that needs to be re-created
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  description: The name of VM workload backup
                  pattern: (\s^)|(^[^\u0000-\u001f\u007f-\u009f]*$)
                  minLength: 1
