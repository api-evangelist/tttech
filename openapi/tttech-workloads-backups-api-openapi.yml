          content:
            application/json:
              schema:
                description: Object contains the vm backup name used in requests for creating a new VM backup or restarting the failed one
                type: object
                required:
                - name
                - message
                additionalProperties: false
                properties:
                  name:
                    type: string
                    description: The name of VM workload backup
                    pattern: (\s^)|(^[^\u0000-\u001f\u007f-\u009f]*$)
                    minLength: 1
                    maxLength: 1001
                  message:
