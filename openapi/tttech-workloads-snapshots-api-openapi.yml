    post:
      summary: Create a snapshot schedule for the selected VM workload
      operationId: create_vm_schedule_snapshot_config
      tags:
      - WORKLOADS SNAPSHOTS
      x-permissions:
      - SNAPSHOT_SCHEDULE:CREATE
      description: Used to create a snapshot schedule
      parameters:
      - name: deviceId
        in: path
        required: true
        description: Unique identifier of the deployed workload. Device is a term used for workloads.
        schema:
          type: string
          description: Id of the deployed workload
          pattern: ^\d+$
          minLength: 1
          maxLength: 1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Object containing information if and how creation of snapshots is or should be scheduled
              additionalProperties: false
              required:
              - type
              - intervalTime
              - day
              - dayTime
              - dayHours
              - dayMinutes
              - vmState
              - timeZone
              - timezoneOffset
              properties:
                type:
                  type: string
                  description: Type of schedule
                  enum:
                  - Interval
                  - Day
                intervalTime:
                  type: integer
                  description: Interval in hours
                  minimum: 1
                  maximum: 9999
                day:
                  oneOf:
                  - type: string
                    description: Day of the week
                    enum:
                    - Monday
                    - Tuesday
                    - Wednesday
                    - Thursday
                    - Friday
                    - Saturday
                    - Sunday
                    - Every day
                  - type: string
                    description: Empty string
                    enum:
                    - ''
                    minLength: 0
                    maxLength: 0
                    pattern: ^$
                dayTime:
                  oneOf:
                  - type: string
                    description: Time of day when snapshot will be created
                    minLength: 0
                    maxLength: 5
                    pattern: ^([0-9]|0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
                  - type: string
                    description: Empty string
                    enum:
                    - ''
                    minLength: 0
                    maxLength: 0
                    pattern: ^$
                dayHours:
                  type: integer
                  description: Hour at which snapshot will be created
                  minimum: 0
                  maximum: 23
                dayMinutes:
                  type: integer
                  description: Minute of the hour at which snapshot will be created
                  minimum: 0
                  maximum: 59
                vmState:
                  type: string
                  description: State in which VM should be when snapshot is captured
                  enum:
                  - Current
                  - Stopped
                timeZone:
                  type: string
                  description: The name of the timezone
                  minLength: 0
                  maxLength: 1001
                  pattern: ^[A-Za-z]+\/[A-Za-z_]+$
                timezoneOffset:
                  type: string
                  pattern: ^[+-]*[\d]+$
                  description: Timezone offset
                  minLength: 0
                  maxLength: 1001
            examples:
              vm_schedule_snapshot_config:
                value:
                  type: Day
                  intervalTime: 1
                  day: Friday
                  dayTime: 06:15
                  dayHours: 1
                  dayMinutes: 1
                  vmState: Stopped
                  timeZone: Europe/Belgrade
                  timezoneOffset: '+2'
      responses:
        '201':
          description: Schedule snapshot creation successfully setup
          content:
            application/json:
              schema:
                type: string
                description: Message confirming the creation of the schedule configuration
              examples:
                vm_scheduled_snapshot:
                  value: Snapshot creation scheduled
