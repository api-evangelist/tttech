    put:
      summary: Mount the NFS file system
      tags:
      - Repositories
      x-permissions:
      - REPOSITORY:MOUNT
      description: Mount an NFS file system on a predefined mount point (directory) on the node.
      operationId: mount_repository_to_nfs_server
      parameters:
      - in: path
        name: id
        required: true
