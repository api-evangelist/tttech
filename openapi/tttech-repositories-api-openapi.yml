    get:
      summary: Get the list of VM backups
      tags:
      - Repositories
      x-permissions:
      - REPOSITORY_BACKUP:LIST
      description: Get the list of VM backups on the local repository.
      operationId: get_backup_repository_list
      parameters:
      - name: limit
        in: query
        description: Number of items in result set when paging is applied
        schema:
          description: Number of items in result set when paging is applied
          type: integer
          default: 10
          minimum: 1
          maximum: 1000
      - name: page
        in: query
        description: Page of results to get from backend
        schema:
          description: Page of results to get from backend
          type: integer
          default: 1
          minimum: 1
          maximum: 1000
      - name: searchText
        in: query
        description: Number of items in result set when searching is applied
        schema:
          description: Number of items in result set when searching is applied
          type: string
          default: ''
          minLength: 0
          maxLength: 1001
          pattern: (\s^)|(^[^\u0000-\u001f\u007f-\u009f]*$)
