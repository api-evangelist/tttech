                    maxLength: 1001
                    pattern: .*
                  path:
                    description: Specifies the local path where the repository is located.
                    type: string
                    minLength: 1
                    maxLength: 1001
                  type:
                    description: Type of local repository
                    type: string
                    enum:
                    - vmBackups
                    - workloads
                  protocol:
                    description: Specifies the protocol to be used for communication with the local repository.
                    type: string
                    enum:
                    - nfs
                    - http
                    - https
                  id:
                    description: Id of the local repository
                    oneOf:
