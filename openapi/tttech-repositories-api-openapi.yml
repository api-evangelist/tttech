                      description: Specifies the protocol to be used for communication with the local repository.
                      enum:
                      - http
                      - https
                    user:
                      type:
                      - string
                      - 'null'
                      description: Username is used to authenticate local repository.
                      minLength: 0
                      maxLength: 1001
                      pattern: .*
