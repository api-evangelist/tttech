              protocol: nfs
              type: workloads
      responses:
        '200':
          description: Successful operation. The local repository successfully updated.
          content:
            application/json:
              schema:
                type: object
                description: Repository basic information from database
                additionalProperties: false
                required:
                - id
                - type
                - protocol
                - path
                - user
                - password
                - options
                - priority
                properties:
                  priority:
                    type:
