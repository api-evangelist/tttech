openapi: 3.2.0
info:
  version: 3.1.0
  description: 'Nerve Management System API to manage: -labels -nodes -workloads -notifications -capabilities'
  title: Nerve Management System WL VERSION V3 API
  contact:
    name: Nerve support
    email: support@tttech-industrial.com
servers:
- url: https://trynerve1.nerve.cloud
security:
- sessionId: []
tags:
- name: WL_VERSION_v3
  description: The operations to manage specific versions of workloads v3
paths:
  /nerve/v3/workloads/{workloadId}/versions:
    post:
      summary: Add new version of the selected workload
      operationId: create_version_v3
      tags:
      - WL_VERSION_v3
      description: Method is used to create a new version for provided workload
      parameters:
      - name: workloadId
        in: path
        required: true
        description: Workload Id
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An object containing all the information required to create a new workload version
              required:
              - name
              - workloadSpecificProperties
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: Version name
                  minLength: 1
                  maxLength: 40
                  pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                released:
                  type: boolean
                  description: Indicates if the version is marked as released(if so, the version cannot be modified anymore)
                  default: false
                selectors:
                  type: array
                  minItems: 0
                  maxItems: 1001
                  description: List of ids of selectors to be assigned to the workload version. The list should include unique items - duplicates are not allowed.
                  uniqueItems: true
                  items:
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
                    minLength: 1
                    maxLength: 1000
                remoteConnections:
                  type: array
                  minItems: 0
                  maxItems: 1001
                  description: List of remote connections defined for provided workload version
                  items:
                    anyOf:
                    - type: object
                      description: An object containing data about remote tunnel connection. Remote tunnel connection is connection that is established between local workstation and the target. For those connections Nerve Connection Manager application MUST be installed on local workstation.
                      required:
                      - name
                      - acknowledgment
                      - port
                      - localPort
                      - type
                      properties:
                        type:
                          type: string
                          description: Remote connection type
                          enum:
                          - TUNNEL
                        name:
                          type: string
                          description: Remote connection name
                          pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                          minLength: 1
                          maxLength: 40
                        acknowledgment:
                          type: string
                          description: Defines if local acknowledgement is required to establish a connection. To confirm connection, it is necessary to have access to the LocalUI web application.
                          enum:
                          - 'Yes'
                          - 'No'
                        port:
                          type: integer
                          format: int32
                          minimum: 0
                          maximum: 65535
                          description: Port on the target to which connection is established (port on the node for opening tunnel to chisel server)
                        localPort:
                          type: integer
                          format: int32
                          minimum: 0
                          maximum: 65535
                          description: Port on local PC to establish remote tunnel
                        serviceName:
                          type:
                          - string
                          - 'null'
                          description: A extra parameter of the remote connection for 'docker-compose' workload. Refers to one of the services listed in the compose YAML file, a service(container) for which remote connection has been configured. This is a mandatory parameter for remote connections for 'docker-compose' workloads, but not for other workload types.
                          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
                          minLength: 1
                          maxLength: 40
                    - type: object
                      description: An object containing data about remote tunnel connection. Remote tunnel connection is connection that is established between local workstation and the target. For those connections Nerve Connection Manager application MUST be installed on local workstation.
                      required:
                      - name
                      - acknowledgment
                      - hostname
                      - port
                      - localPort
                      - type
                      properties:
                        type:
                          type: string
                          description: Remote connection type
                          enum:
                          - TUNNEL
                        name:
                          type: string
                          description: Remote connection name
                          pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                          minLength: 1
