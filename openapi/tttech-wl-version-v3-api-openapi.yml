  /nerve/v3/workloads/{workload_id}/versions/{version_id}/export-remote-connections:
    get:
      summary: Export remote connections
      operationId: export_rc_on_wl
      security:
      - cookieAuth: []
      tags:
      - WL_VERSION_v3
      description: Method is used to export remote connection on workload version.
      parameters:
      - name: workload_id
        in: path
        required: true
        description: Workload Id
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      - name: version_id
        in: path
        required: true
        description: Workload version Id
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      x-permissions:
      - WORKLOAD:VIEW
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                pattern: ^[\x20-\x7E\t\n\r]*$
                format: binary
                minLength: 1
                maxLength: 1000
                description: Binary data of the exported remote connections
          headers:
            Content-Disposition:
              schema:
                type: string
                pattern: ^[\x20-\x7E\t\n\r]*$
                minLength: 1
                maxLength: 1000
                example: attachment; filename=file_name.tar
                description: Exported file name
        '400':
          description: Request failed, this is the response received when workload version is not deployable and thus cannot be exported
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
