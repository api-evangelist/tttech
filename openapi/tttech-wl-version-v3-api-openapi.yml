        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: An object containing detailed information of the workload version(information of interest for the user)
                required:
                - _id
                - name
                - released
                - isDeployable
                - workloadSpecificProperties
                - hash
                - summarizedFileStatuses
                - createdAt
                properties:
                  _id:
                    description: ID (from Management System) of the entry
                    type: string
                    pattern: ^[0-9a-fA-F]{24}$
                    minLength: 24
                    maxLength: 24
                  name:
                    type: string
                    description: Version name
                    minLength: 1
                    maxLength: 40
                    pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                  released:
                    type: boolean
                    description: Indicates if the version is marked as released(if so, the version cannot be modified anymore)
                    default: false
                  hash:
                    description: Hash of the version structure that changes with every change in version files or properties
                    default: ''
                    minLength: 0
                    maxLength: 1000
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
                  isDeployable:
                    type: boolean
                    description: Indicates if the version is marked as deployable(if not, the version definition is not complete and thus cannot be deployed)
                  workloadSpecificProperties:
                    oneOf:
                    - type: object
                      description: An object containing a specific properties for docker-compose workload type
                      additionalProperties: false
                      properties:
                        dockerConfigurationStorage:
                          type: array
                          minItems: 0
                          maxItems: 1001
                          description: 'List of configuration storages defined for each service individually. NOTE:: Currently there will be only one service in the docker-compose file. In the future, there will be more.'
                          items:
                            type: object
                            description: An object containing information about volumes marked to be used as configuration storage for a particular service
                            additionalProperties: false
                            required:
                            - volumeName
                            - serviceName
                            - containerPath
                            properties:
                              volumeName:
                                type: string
                                description: 'The docker volume name. The name is extracted from docker-compose file. Volume name can only contain numbers, letters, _ and -. NOTE: For now only volume name is allowed. Bind mount points are not allowed.'
                                pattern: ^[A-z0-9-.]*$
                                minLength: 1
                                maxLength: 1000
                              serviceName:
                                type: string
                                description: The name of the service to which the configuration refers. The service name is extracted from the docker-compose file. Service name can only contain numbers, letters,_ and -.
                                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
                                minLength: 1
                                maxLength: 40
                              restartOnConfigurationUpdate:
                                type: boolean
                                description: Indicates whether the docker container should be restarted on configuration update or not
                                default: false
                              containerPath:
                                type: string
                                description: The path in the container where the volume is mounted
                                pattern: ^[A-z0-9/.-]*$
                                minLength: 1
                                maxLength: 1000
                    - description: Docker specific properties
                      type: object
                      required:
                      - container_name
                      properties:
                        container_name:
                          type: string
                          description: Docker container name
                          minLength: 2
                          maxLength: 100
                          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]+$
                        restart_policy:
                          description: Restart policy for docker container
                          anyOf:
                          - type: string
                            description: Restart policy for docker container
                            enum:
                            - 'no'
                            - on-failure
                            - always
                            - unless-stopped
                          - type: string
                            enum:
                            - ''
                        networks:
                          type: array
                          description: List of connected networks
                          minItems: 0
                          maxItems: 1001
                          items:
                            minLength: 1
                            maxLength: 1000
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
