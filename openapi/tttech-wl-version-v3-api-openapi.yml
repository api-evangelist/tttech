                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              example:
                httpCode: '501'
                errorCode: nerve_workload_167
                message: Action is not supported for provided workload type. The V3 API for workloads/versions/files is available only for docker-compose workload type(other workload types are not supported yet).
    get:
      summary: Get version data of the selected workload
      operationId: get_version_v3
      tags:
      - WL_VERSION_v3
      description: Method is used to retrieve the data of the specific workload version
      parameters:
      - name: workloadId
        in: path
        required: true
        description: Workload Id
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      - name: versionId
        in: path
        required: true
        description: Workload version Id
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      x-permissions:
      - WORKLOAD:VIEW
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: An object containing detailed information of the workload version(information of interest for the user)
                required:
                - _id
                - name
                - released
                - isDeployable
                - workloadSpecificProperties
                - hash
                - summarizedFileStatuses
                - createdAt
                properties:
                  _id:
                    description: ID (from Management System) of the entry
                    type: string
                    pattern: ^[0-9a-fA-F]{24}$
                    minLength: 24
                    maxLength: 24
                  name:
                    type: string
                    description: Version name
                    minLength: 1
                    maxLength: 40
                    pattern: (?=.*[^ ].*)(?=(^[^\u0000-\u001f\u007f-\u009f]*$))
                  released:
                    type: boolean
                    description: Indicates if the version is marked as released(if so, the version cannot be modified anymore)
                    default: false
                  hash:
                    description: Hash of the version structure that changes with every change in version files or properties
                    default: ''
                    minLength: 0
                    maxLength: 1000
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
                  isDeployable:
                    type: boolean
                    description: Indicates if the version is marked as deployable(if not, the version definition is not complete and thus cannot be deployed)
                  workloadSpecificProperties:
                    oneOf:
                    - type: object
                      description: An object containing a specific properties for docker-compose workload type
                      additionalProperties: false
                      properties:
                        dockerConfigurationStorage:
                          type: array
                          minItems: 0
                          maxItems: 1001
                          description: 'List of configuration storages defined for each service individually. NOTE:: Currently there will be only one service in the docker-compose file. In the future, there will be more.'
                          items:
                            type: object
                            description: An object containing information about volumes marked to be used as configuration storage for a particular service
                            additionalProperties: false
                            required:
                            - volumeName
                            - serviceName
                            - containerPath
                            properties:
                              volumeName:
                                type: string
                                description: 'The docker volume name. The name is extracted from docker-compose file. Volume name can only contain numbers, letters, _ and -. NOTE: For now only volume name is allowed. Bind mount points are not allowed.'
                                pattern: ^[A-z0-9-.]*$
                                minLength: 1
                                maxLength: 1000
                              serviceName:
                                type: string
                                description: The name of the service to which the configuration refers. The service name is extracted from the docker-compose file. Service name can only contain numbers, letters,_ and -.
                                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
                                minLength: 1
                                maxLength: 40
                              restartOnConfigurationUpdate:
                                type: boolean
                                description: Indicates whether the docker container should be restarted on configuration update or not
                                default: false
                              containerPath:
                                type: string
                                description: The path in the container where the volume is mounted
                                pattern: ^[A-z0-9/.-]*$
                                minLength: 1
                                maxLength: 1000
                    - description: Docker specific properties
                      type: object
                      required:
                      - container_name
                      properties:
                        container_name:
                          type: string
                          description: Docker container name
                          minLength: 2
                          maxLength: 100
                          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]+$
                        restart_policy:
                          description: Restart policy for docker container
                          anyOf:
                          - type: string
                            description: Restart policy for docker container
                            enum:
                            - 'no'
                            - on-failure
                            - always
                            - unless-stopped
                          - type: string
                            enum:
                            - ''
                        networks:
                          type: array
                          description: List of connected networks
                          minItems: 0
                          maxItems: 1001
                          items:
                            minLength: 1
                            maxLength: 1000
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
                        docker_volumes:
                          description: List of mapped volumes
                          minItems: 0
                          maxItems: 1001
                          type: array
                          items:
                            type: object
                            required:
                            - volumeName
                            - containerPath
                            - configurationStorage
                            properties:
                              volumeName:
                                description: Name of the volume
                                minLength: 1
                                maxLength: 1000
                                type: string
                                pattern: ^[\x20-\x7E\t\n\r]*$
                              containerPath:
                                description: Path inside the container where the volume is mapped
                                minLength: 1
                                maxLength: 1000
                                type: string
                                pattern: ^[\x20-\x7E\t\n\r]*$
                              configurationStorage:
                                type: boolean
                                description: Flag indicating whether the volume is used for configuration storage
                        environment_variables:
                          minItems: 0
                          maxItems: 1001
                          type: array
                          description: List of environment variables
                          items:
                            type: object
                            required:
                            - env_variable
                            - container_value
                            properties:
                              env_variable:
                                type: string
                                description: Name of the environment variable
                                pattern: ^[a-zA-Z_]+[a-zA-Z0-9_]*$
                                minLength: 1
                                maxLength: 1000
                              container_value:
                                description: Value of the environment variable
                                minLength: 1
                                maxLength: 1000
                                type: string
                                pattern: ^[\x20-\x7E\t\n\r]*$
                        limit_CPUs:
                          description: CPU limit for the container
                          anyOf:
                          - type: integer
                            format: int64
                            minimum: 1
                            maximum: 1000
                          - type: string
                            enum:
                            - ''
                        limit_memory:
                          description: Memory limit for the container
                          anyOf:
                          - oneOf:
                            - type: object
                              description: Memory limit in KB
                              minProperties: 2
                              maxProperties: 2
                              required:
                              - value
                              - unit
                              properties:
                                value:
                                  type: number
                                  description: Memory limit value in KB
                                  minimum: 100000
                                unit:
                                  description: Memory limit unit
                                  enum:
                                  - KB
                            - type: object
                              description: Memory limit in MB
                              minProperties: 2
                              maxProperties: 2
                              required:
                              - value
                              - unit
                              properties:
                                value:
                                  type: number
                                  description: Memory limit value in MB
                                  minimum: 100
                                unit:
                                  description: Memory limit unit
                                  enum:
                                  - MB
                            - type: object
                              description: Memory limit in GB
                              minProperties: 2
                              maxProperties: 2
                              required:
                              - value
                              - unit
                              properties:
                                value:
                                  description: Memory limit value in GB
                                  type: number
                                  minimum: 0.1
                                unit:
                                  description: Memory limit unit
                                  enum:
                                  - GB
                            - type: object
                              description: Memory limit in TB
                              minProperties: 2
                              maxProperties: 2
                              required:
                              - value
                              - unit
                              properties:
                                value:
                                  description: Memory limit value in TB
                                  type: number
                                  minimum: 9.999999999999999e-05
                                unit:
                                  description: Memory limit unit
                                  enum:
