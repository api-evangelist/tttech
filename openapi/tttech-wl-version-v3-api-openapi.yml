                                - UDP
                              host_port:
                                type: integer
                                format: int32
                                description: Port number
                                minimum: 0
                                maximum: 65535
                              container_port:
                                type: integer
                                format: int32
                                description: Port number
                                minimum: 0
                                maximum: 65535
