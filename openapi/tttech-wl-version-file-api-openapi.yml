  /nerve/v3/workloads/{workloadId}/versions/{versionId}/define-all-files:
    post:
      summary: Define all files for specified workload version
      operationId: define_all_files_v3
      tags:
      - WL_VERSION_FILE
      description: Define all files to workload version
      parameters:
      - name: workloadId
        in: path
        required: true
        description: Workload Id
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      - name: versionId
        in: path
        required: true
        description: Workload version Id
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      requestBody:
        description: File information.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: An object containing all the information required to define all files for a specific workload version
              required:
              - files
              additionalProperties: false
              properties:
                files:
                  type: array
                  description: List of files to be defined
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required:
                    - type
                    - origin
                    - source
                    additionalProperties: false
                    properties:
                      type:
                        description: Type of workload file being defined
                        type: string
                        enum:
                        - docker-image
                      origin:
                        description: From where file comes to MS
                        type: string
                        enum:
                        - docker-repo
                        - upload
                        - clone
                      source:
                        description: Value depends on origin field - If origin is docker repo, it is image name or image url - If origin is upload, it is name of the form field which carries file - If origin is clone, it is the ID of the file being cloned
                        minLength: 1
                        maxLength: 1000
                        type: string
                        pattern: ^[\x20-\x7E\t\n\r]*$
                      username:
                        description: If source requires authentication, it is username to be used
                        type: string
                        minLength: 1
                        maxLength: 1000
                        pattern: ^[^\u0000-\u001f\u007f-\u009f:]*$
                      password:
                        description: If source requires authentication, it is password to be used
                        minLength: 1
                        maxLength: 1000
                        type: string
                        pattern: ^[\x20-\x7E\t\n\r]*$
            example:
              files:
              - type: docker-image
                origin: docker-repo
                source: nginx:latest
                username: username
                password: password
      x-permissions:
      - WORKLOAD:EDIT
      responses:
        '200':
          description: List of files for specific workload version
          content:
            application/json:
              schema:
                description: Response for get all files request
                type: object
                required:
                - count
                - files
                properties:
                  count:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 1000000
                    description: Number of results
                  files:
                    description: List of files
                    type: array
                    minItems: 0
                    maxItems: 51
                    items:
                      allOf:
                      - description: File information
                        type: object
                        required:
                        - type
                        - origin
                        - source
                        properties:
                          type:
                            description: Type of workload file being submitted
                            type: string
                            enum:
                            - compose
                            - docker-image
                          origin:
                            description: From where file comes to MS
                            type: string
                            enum:
                            - docker-repo
                            - upload
                            - clone
                          source:
                            description: Value depends on origin field - If origin is docker repo, it is image name or image url - If origin is upload, it is name of the form field which carries file - If origin is clone, it is the ID of the file being cloned
                            minLength: 1
                            maxLength: 1000
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
                          name:
                            description: Name of the archived file or name of the docker image (docker and docker-compose workloads that are using registry)
                            minLength: 1
                            maxLength: 1000
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
                          originalName:
                            description: Name of the uploaded file or name of the docker image (docker and docker-compose workloads that are using registry)
                            minLength: 0
                            maxLength: 1000
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
                      - type: object
                        required:
                        - _id
                        - status
                        properties:
                          _id:
                            description: ID (from Management System) of the entry
                            type: string
                            pattern: ^[0-9a-fA-F]{24}$
                            minLength: 24
                            maxLength: 24
                          status:
                            description: File download status
                            type: string
                            enum:
                            - downloading
                            - available
                            - failed
                            - cancelled
                            - pending
                          lastError:
                            description: Error that occurred when fetching file. Only set in case when 'status' is set to 'failed'
                            type: string
                            minLength: 0
                            maxLength: 1000
                            pattern: ^[\x20-\x7E\t\n\r]*$
                          username:
                            description: If source requires authentication, it is username to be used
                            type: string
                            minLength: 1
                            maxLength: 1000
                            pattern: ^[^\u0000-\u001f\u007f-\u009f:]*$
              example:
