      responses:
        '200':
          description: List of files for specific workload version
          content:
            application/json:
              schema:
                description: Response for get all files request
                type: object
                required:
                - count
                - files
                properties:
                  count:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 1000000
                    description: Number of results
                  files:
                    description: List of files
                    type: array
                    minItems: 0
                    maxItems: 51
                    items:
                      allOf:
                      - description: File information
                        type: object
                        required:
                        - type
                        - origin
                        - source
                        properties:
                          type:
                            description: Type of workload file being submitted
                            type: string
                            enum:
                            - compose
                            - docker-image
                          origin:
                            description: From where file comes to MS
                            type: string
                            enum:
                            - docker-repo
                            - upload
                            - clone
                          source:
                            description: Value depends on origin field - If origin is docker repo, it is image name or image url - If origin is upload, it is name of the form field which carries file - If origin is clone, it is the ID of the file being cloned
                            minLength: 1
                            maxLength: 1000
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
                          name:
                            description: Name of the archived file or name of the docker image (docker and docker-compose workloads that are using registry)
                            minLength: 1
                            maxLength: 1000
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
                          originalName:
                            description: Name of the uploaded file or name of the docker image (docker and docker-compose workloads that are using registry)
                            minLength: 0
                            maxLength: 1000
                            type: string
                            pattern: ^[\x20-\x7E\t\n\r]*$
                      - type: object
                        required:
                        - _id
                        - status
                        properties:
                          _id:
                            description: ID (from Management System) of the entry
                            type: string
                            pattern: ^[0-9a-fA-F]{24}$
                            minLength: 24
                            maxLength: 24
                          status:
                            description: File download status
                            type: string
                            enum:
                            - downloading
                            - available
                            - failed
                            - cancelled
                            - pending
                          lastError:
                            description: Error that occurred when fetching file. Only set in case when 'status' is set to 'failed'
                            type: string
                            minLength: 0
                            maxLength: 1000
                            pattern: ^[\x20-\x7E\t\n\r]*$
                          username:
                            description: If source requires authentication, it is username to be used
                            type: string
                            minLength: 1
                            maxLength: 1000
                            pattern: ^[^\u0000-\u001f\u007f-\u009f:]*$
              example:
                count: 1
                files:
                - _id: 62befe27d82c98006ed99cbe
                  status: downloading
                  type: compose
                  origin: docker-repo
                  source: nginx:latest
        '400':
          description: Route params validation error
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
