openapi: 3.2.0
info:
  version: 3.1.0
  description: 'Nerve Management System API to manage: -labels -nodes -workloads -notifications -capabilities'
  title: Nerve Management System WL VERSION FILE API
  contact:
    name: Nerve support
    email: support@tttech-industrial.com
servers:
- url: https://trynerve1.nerve.cloud
security:
- sessionId: []
tags:
- name: WL_VERSION_FILE
  description: The operations to manage workload files of specific versions v3
paths:
  /nerve/v3/workloads/{workloadId}/versions/{versionId}/files:
    post:
      summary: Add file to the selected workload version
      operationId: add_file_v3
      tags:
      - WL_VERSION_FILE
      description: Add a file to workload version
      parameters:
      - name: workloadId
        in: path
        required: true
        description: Workload Id
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      - name: versionId
        in: path
        required: true
        description: Workload version Id
        schema:
          description: ID (from Management System) of the entry
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          minLength: 24
          maxLength: 24
      requestBody:
        description: File information. For details on the submission form fields please refer to the schema **v3_add_edit_file** at the end of the file.
        required: true
        content:
          multipart/form-data:
            schema:
              description: Schema for uploading and validating a docker-compose file
              additionalProperties: false
              type: object
              properties:
                type:
                  description: Type of workload file being submitted
                  type: string
                  enum:
                  - compose
                  - docker-image
                origin:
                  description: From where file comes to MS
                  type: string
                  enum:
                  - docker-repo
                  - upload
                  - clone
                source:
                  description: Value depends on origin field - If origin is docker repo, it is image name or image url - If origin is upload, it is name of the form field which carries file - If origin is clone, it is the ID of the file being cloned
                  minLength: 1
                  maxLength: 1000
                  type: string
                  pattern: ^[\x20-\x7E\t\n\r]*$
                username:
                  description: If source requires authentication, it is username to be used
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: ^[^\u0000-\u001f\u007f-\u009f:]*$
                password:
                  description: If source requires authentication, it is password to be used
                  minLength: 1
                  maxLength: 1000
                  type: string
                  pattern: ^[\x20-\x7E\t\n\r]*$
                file:
                  type: string
                  description: File to be uploaded
                  format: binary
                  minLength: 1
                  maxLength: 1000
      x-permissions:
      - WORKLOAD:EDIT
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                allOf:
                - description: File information
                  type: object
                  required:
                  - type
                  - origin
                  - source
                  properties:
                    type:
                      description: Type of workload file being submitted
                      type: string
                      enum:
                      - compose
                      - docker-image
                    origin:
                      description: From where file comes to MS
                      type: string
                      enum:
                      - docker-repo
                      - upload
                      - clone
                    source:
                      description: Value depends on origin field - If origin is docker repo, it is image name or image url - If origin is upload, it is name of the form field which carries file - If origin is clone, it is the ID of the file being cloned
                      minLength: 1
                      maxLength: 1000
                      type: string
                      pattern: ^[\x20-\x7E\t\n\r]*$
                    name:
                      description: Name of the archived file or name of the docker image (docker and docker-compose workloads that are using registry)
                      minLength: 1
                      maxLength: 1000
                      type: string
                      pattern: ^[\x20-\x7E\t\n\r]*$
                    originalName:
                      description: Name of the uploaded file or name of the docker image (docker and docker-compose workloads that are using registry)
                      minLength: 0
                      maxLength: 1000
                      type: string
                      pattern: ^[\x20-\x7E\t\n\r]*$
                - type: object
                  required:
                  - _id
                  - status
                  properties:
                    _id:
                      description: ID (from Management System) of the entry
                      type: string
                      pattern: ^[0-9a-fA-F]{24}$
                      minLength: 24
                      maxLength: 24
                    status:
                      description: File download status
                      type: string
                      enum:
                      - downloading
                      - available
                      - failed
                      - cancelled
                      - pending
                    lastError:
                      description: Error that occurred when fetching file. Only set in case when 'status' is set to 'failed'
                      type: string
                      minLength: 0
                      maxLength: 1000
                      pattern: ^[\x20-\x7E\t\n\r]*$
                    username:
                      description: If source requires authentication, it is username to be used
                      type: string
                      minLength: 1
                      maxLength: 1000
                      pattern: ^[^\u0000-\u001f\u007f-\u009f:]*$
              example:
                _id: 62befe27d82c98006ed99cbe
                status: downloading
                type: docker-image
                origin: docker-repo
                source: nginx:latest
        '400':
          description: Expected file to be uploaded with file data, missing binary file in API request
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              examples:
                file_missing_in_request:
                  value:
                    errorCode: nerve_workload_177
                    httpCode: '400'
                    message: Failed to add/edit file to workload version. File not uploaded. Please check that file is not missing in your API request.
        '403':
          description: You are not authorized to perform this operation
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              examples:
                not_authorized:
                  value:
                    errorCode: '00003'
                    httpCode: '403'
                    message: You are not authorized
        '404':
          description: 'Request failed, this is the response received when: - Specified workload does not exist - Specified version does not exist'
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              examples:
                workload_not_found:
                  value:
                    errorCode: '000700'
                    httpCode: '404'
                    message: Workload you are looking for does not exist
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              example:
                errorCode: '00006'
                httpCode: '415'
                message: Route params validation error
        '500':
          description: Request failed, this is the response received when an unexpected error occurred on the server side
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              example:
                httpCode: '500'
                errorCode: nerve_workload_166
                message: Failed to finalize request, unexpected error occurred.
        '501':
          description: Request failed, this is the response received when the action cannot be performed due to a missing implementation in the V3 API version for the type of workload provided
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              example:
                httpCode: '501'
                errorCode: nerve_workload_167
                message: Action is not supported for provided workload type. The V3 API for workloads/versions/files is available only for docker-compose workload type(other workload types are not supported yet).
    get:
      summary: Get list of files for the selected version of the selected workload
      operationId: get_files_v3
      tags:
      - WL_VERSION_FILE
      description: Fetch information about all files from specific workload version
      parameters:
