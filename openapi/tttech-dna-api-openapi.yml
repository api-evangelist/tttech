                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              examples:
                node_not_available:
                  value:
                    httpCode: '404'
                    errorCode: nerve_dna_008
                    message: The node with specified serial number is not available.
        '409':
          description: The node does not have node DNA capability
          content:
