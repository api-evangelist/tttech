                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              examples:
                node_missing_node_dna_capability:
                  value:
                    httpCode: '409'
                    errorCode: nerve_dna_033
                    message: Node DNA functionality is not supported on this node. No capability reported.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              examples:
                unknown_error:
                  value:
                    httpCode: '500'
                    errorCode: nerve_dna_006
                    message: Configuration operation failed for unknown reason.
      security:
      - sessionId: []
    put:
      summary: Apply target configuration to the selected node
      description: 'Used to update the existing configuration of the selected node by using configuration file. Required permission: **NERVE_DNA:EDIT**'
      operationId: apply_dna_configuration
      tags:
      - DNA
      parameters:
      - name: serialNumber
        in: path
        required: true
        description: The serial number of the node which was specified during onboarding into the Nerve Management System.
        schema:
          description: The serial number of the node
          type: string
          maxLength: 12
          minLength: 12
          pattern: ([A-Z0-9]){12}
      - in: query
        name: continueInCaseOfRestart
        schema:
          type: boolean
          default: false
        description: Select whether the node should continue DNA reconfiguration when it comes online again. Available only for node with version >= 2.7.0
      - in: query
        name: restartAllWorkloads
        schema:
          type: boolean
          default: true
        description: If the flag is set to false, workloads will not be reset if they already exist on the node. Default value is true.
      - name: removeDockerImages
        in: query
        schema:
          type: boolean
          default: true
        description: If the flag is set to true, Docker images will be removed from the node. If set to false, the images will be retained. Docker images are removed from the node as part of the undeployment that is executed before the DNA file is applied,  to eliminate workloads that are not part of that DNA configuration. This setting applies specifically to workloads using the Management System Registry. Available only for nodes with version >= 2.10.0.
      - in: query
        name: signFile
        description: Indicates whether the file should be signed by MS before it is applied to the node. Available only for nodes >= 3.1.0
        schema:
          type: boolean
          default: false
      requestBody:
        description: Includes configuration file
        required: true
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              description: Request body for updating the node configuration
              type: object
              properties:
                file:
                  description: Configuration file for updating the node configuration
                  type: string
                  format: binary
                  minLength: 1
                  maxLength: 1000
      x-permissions:
      - NERVE_DNA:EDIT
      responses:
        '202':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: Object with DNA configuration initiation status message and tracking URI
                additionalProperties: false
                properties:
                  message:
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
                    description: Message describing the DNA configuration initiation operation
                    minLength: 1
                    maxLength: 1000
                  tracking:
                    type: string
                    description: The URI for getting completion status of job
                    pattern: ^\/nerve\/dna\/([A-Za-z]|\d){12}\/status$
                    minLength: 1
                    maxLength: 1000
                required:
                - message
                - tracking
              examples:
                dna_configuration_initiated:
                  value:
                    message: DNA configuration initiated
                    tracking: /nerve/dna/123456789012/status
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                description: Generic error response returned from the server in case of a failed operation.
                properties:
                  errorCode:
                    description: String that is used as a key for appropriate translation on the front-end application.
                    type: string
                    minLength: 4
                    maxLength: 100
                    pattern: ^[a-zA-Z0-9_-]*$
                  httpCode:
                    description: Http error code assigned to the error.
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: ^[0-9]*$
                  message:
                    description: Error message in English.
                    minLength: 5
                    maxLength: 512
                    type: string
                    pattern: ^[\x20-\x7E\t\n\r]*$
              examples:
                error_upload_config_file:
                  value:
                    httpCode: '400'
                    errorCode: nerve_dna_001
                    message: File upload failed.
                config_file_error:
                  value:
                    httpCode: '400'
                    errorCode: nerve_dna_002
                    message: Payload not defined.
                continue_reconfiguration_not_supported:
                  value:
                    httpCode: '400'
                    errorCode: nerve_dna_019
                    message: Only nodes with version 2.7.0 and greater can continue DNA reconfiguration.
