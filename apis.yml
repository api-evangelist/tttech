  - type: APIReference
    url: https://docs.nerve.cloud/developer_guide/ms-api/
  - type: Overlay
    url: overlays/tttech-nerve-management-system-overlay.yaml
- name: Nerve Node API
  description: >-
    REST API served by the Nerve Local UI on each Nerve edge node. Covers node initialization and license
    activation, system and network configuration, proxy settings, local users and permissions, Docker image
    and volume resources, workload deployment, snapshots, backups, logs and compose, CODESYS process control,
    remote connections, the Data Services datapath and Nerve DNA. Cookie / basic authentication; OpenAPI 3.0.1,
    77 operations.
  humanURL: https://docs.nerve.cloud/developer_guide/ms-api/#nerve-node-api
  baseURL: http://172.20.2.1:3333
