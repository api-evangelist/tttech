aid: tttech
name: TTTech
description: >-
  TTTech Computertechnik AG is a Vienna-based supplier of deterministic networking and safety-critical
  embedded platforms — TTP, TTEthernet and IEEE 802.1 Time-Sensitive Networking — for aerospace, space,
  automotive, energy and industrial automation. Its public developer surface is Nerve, the industrial edge
  computing and device-management platform built by TTTech Industrial Automation AG: a hosted Management
  System plus on-device node software that deploys and controls Docker, docker-compose, CODESYS and virtual
  machine workloads on certified edge hardware. Nerve publishes two OpenAPI 3 contracts — the Nerve
  Management System API (151 operations across nodes, workloads, labels, LDAP, DNA, remote connections,
  notifications and the Docker registry) and the Nerve Node API (77 operations for on-device configuration,
  networking, workloads and users) — together with a first-party Python library and CLI on GitHub. The
  platform is certified to IEC 62443-4-2 and ships a documented product-security reporting channel.
