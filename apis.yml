apis:
- name: Nerve Management System API
  description: >-
    REST API of the Nerve Management System, the cloud-hosted control plane for Nerve edge nodes. Covers
    authentication and MFA, node registration and lifecycle, workload and workload-version management
    (Docker, docker-compose, CODESYS, VM), deployment and workload control, labels, LDAP integration,
    Nerve DNA declarative node configuration, remote connections, notifications, the Nerve Docker registry,
    node/cloud updates and usage reports. Session-cookie / sessionId authentication with basic and bearer
    variants; OpenAPI 3.0.3, 151 operations.
  humanURL: https://docs.nerve.cloud/developer_guide/ms-api/
  baseURL: https://trynerve1.nerve.cloud
  tags:
  - Industrial IoT
  - Edge Computing
  - Device Management
  - Workload Orchestration
  - Industrial Automation
  tags_raw:
