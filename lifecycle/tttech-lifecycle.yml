  detail: >-
    The API document version tracks the Nerve product release, and the Management System runs multiple
    resource generations concurrently (/nerve/workloads, /nerve/v2/..., /nerve/v3/...). Documentation for
    every prior release from 2.0.0 to 3.1.0 stays online at https://docs.nerve.cloud/<version>/, which is
    an unusually complete version archive for a platform of this size.
