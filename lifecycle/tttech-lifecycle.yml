deprecation:
  policy_url: null
  sunset_header: false
  detail: >-
    TTTech publishes no API deprecation policy and neither contract sends Sunset or Deprecation headers
    (RFC 8594) — a search of both documents for "sunset" returns zero matches. Deprecation is
    communicated in prose in the release notes and in the device guide, and it is real: the MFN 100 and
    the Siemens SIMATIC IPC427E are both marked "Deprecated, do not use for new designs", the XEN
    hypervisor images were deprecated in 2.8.1, and the PDF build of the documentation was deprecated in
    2023. At the contract level exactly one operation carries deprecated: true.
  announcement_channel: https://docs.nerve.cloud/changelog/
